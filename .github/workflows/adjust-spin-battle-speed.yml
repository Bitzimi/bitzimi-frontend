name: Adjust Spin Battle speed
on:
  push:
    paths:
      - '.github/workflows/adjust-spin-battle-speed.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Slow wheel rotation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/components/SpinBattleGameplay.tsx')
          s=p.read_text()
          old='setRotation(r=>r+7*360+270)'
          new='setRotation(r=>r+5*360+270)'
          if old not in s:
              raise SystemExit('Spin Battle animation target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Build frontend
        run: |
          npm install
          npm run build
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/adjust-spin-battle-speed.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/components/SpinBattleGameplay.tsx .github/workflows/adjust-spin-battle-speed.yml
          git commit -m 'tune: slow Spin Battle wheel animation'
          git push
