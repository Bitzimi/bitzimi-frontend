name: Apply Color Prediction UI Fix
on:
  push:
    branches:
      - fix/color-prediction-global-history-void-lobby-count
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove in-game lobby count badge
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/app/pages/ColorGame.tsx')
          s = p.read_text()
          pattern = r'\s*<Badge variant="outline" className="gap-1"><Users className="h-3 w-3" />\{gameState\.lobbyPlayers\} in lobby</Badge>'
          s2, n = re.subn(pattern, '', s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one in-game lobby badge, found {n}')
          p.write_text(s2)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/ColorGame.tsx .github/workflows/fix-color-selection.yml
          git commit -m "Remove Color Prediction in-game lobby count badge"
          git rm .github/workflows/fix-color-selection.yml
          git commit -m "Remove temporary Color Prediction UI workflow"
          git push