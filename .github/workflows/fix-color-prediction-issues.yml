name: Fix Color Prediction Issues
on:
  push:
    branches: [fix/color-prediction-round-wheel-wallet-ui]
    paths:
      - '.github/workflows/fix-color-prediction-issues.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/app/pages/ColorGame.tsx')
          s = p.read_text()

          # Hide the global floating online counter on the game page; lobby selection owns the lobby count UI.
          s = s.replace('<ResponsiveLayout>', '<ResponsiveLayout hideFloatingOnlineCounter>')

          # Carry one server-authoritative wheel landing angle through the snapshot.
          s = s.replace('roundId:          (data.roundId ?? null) as string | null,', 'roundId:          (data.roundId ?? null) as string | null,\n    spinAngle:         typeof data.spinAngle === "number" ? data.spinAngle : null,')

          # Keep the selected-bet confirmation compact and single-line on mobile.
          s = s.replace('className="text-green-800">', 'className="text-green-800 text-xs sm:text-sm whitespace-nowrap overflow-hidden text-ellipsis">')

          # Header: title/rules on row 1; round/live/waiting on row 2.
          old = '''      <div className="mb-6">\n        <div className="flex items-center justify-between">\n          <div>\n            <div className="flex items-center gap-2 mb-1">\n              <h2 className="text-lg md:text-2xl font-semibold">Red vs Blue Game</h2>\n              <div className="flex items-center gap-1.5 px-2.5 py-1 bg-red-600 rounded-full animate-pulse">'''
          if old in s:
            start = s.index(old)
            end_marker = '''          <Button variant="outline" size="sm" onClick={() => setShowRules(true)}><Info className="mr-2 h-4 w-4" />Rules</Button>\n        </div>\n      </div>'''
            end = s.index(end_marker, start) + len(end_marker)
            block = '''      <div className="mb-6">\n        <div className="grid grid-cols-[minmax(0,1fr)_auto] gap-x-3 gap-y-1 items-center">\n          <div className="flex items-center gap-2 min-w-0">\n            <h2 className="text-base sm:text-lg md:text-2xl font-semibold truncate">Red vs Blue Game</h2>\n            <div className="flex items-center gap-1 px-2 py-0.5 bg-red-600 rounded-full animate-pulse shrink-0">\n              <div className="w-2 h-2 bg-white rounded-full" />\n              <span className="text-xs font-semibold text-white">LIVE</span>\n            </div>\n          </div>\n          <Button variant="outline" size="sm" onClick={() => setShowRules(true)} className="h-8 px-3 shrink-0">\n            <Info className="mr-1.5 h-4 w-4" />Rules\n          </Button>\n          <div className="flex items-center gap-2 min-w-0">\n            <p className="text-sm md:text-base text-gray-600 whitespace-nowrap">Round #{gameState.dailyRoundNumber ?? gameState.roundNumber} <span className="text-xs text-gray-400">today</span></p>\n          </div>\n          <Badge variant={gameState.state === "WAITING" ? "default" : "secondary"} className="uppercase h-7 px-2.5 text-xs justify-self-end shrink-0">\n            {gameState.state}\n          </Badge>\n        </div>\n      </div>'''
            s = s[:start] + block + s[end:]

          # Previous Results: exactly 10 items in a 5x2 grid with no phantom sixth slot.
          s = s.replace('<div className="flex gap-2 flex-wrap">', '<div className="grid grid-cols-5 gap-3 w-fit mx-auto">')

          # Pass deterministic server landing angle to the wheel.
          s = s.replace('<WheelSpinner isSpinning={isSpinning} winner={gameState.winner} timeRemaining={gameState.timeRemaining} gameState={gameState.state} roundNumber={gameState.roundNumber} />', '<WheelSpinner isSpinning={isSpinning} winner={gameState.winner} spinAngle={gameState.spinAngle} timeRemaining={gameState.timeRemaining} gameState={gameState.state} roundNumber={gameState.roundNumber} />')

          p.write_text(s)

          p = Path('src/app/components/WheelSpinner.tsx')
          s = p.read_text()
          s = s.replace('  roundNumber?: number;\n}', '  roundNumber?: number;\n  spinAngle?: number | null;\n}')
          s = s.replace('export function WheelSpinner({ isSpinning, winner, timeRemaining = 0, gameState = "WAITING", roundNumber }: WheelSpinnerProps) {', 'export function WheelSpinner({ isSpinning, winner, spinAngle = null, timeRemaining = 0, gameState = "WAITING", roundNumber }: WheelSpinnerProps) {')
          old_fn = '''  const getTargetRotation = () => {\n    if (!winner) return 0;\n    \n    const baseRotation = 1800; // 5 full spins\n    \n    // Generate random angle within the correct segment\n    let winnerOffset;\n    if (winner === "red") {\n      // RED segment: 180° to 360° (right half)\n      // Random angle between 180 and 360\n      winnerOffset = 180 + Math.random() * 180;\n    } else {\n      // BLUE segment: 0° to 180° (left half)  \n      // Random angle between 0 and 180\n      winnerOffset = Math.random() * 180;\n    }\n    \n    return baseRotation + winnerOffset;\n  };'''
          new_fn = '''  const getTargetRotation = () => {\n    if (!winner) return 0;\n    // The landing angle is generated once by the backend and shared by every client.\n    // Never use Math.random() here: two phones must end at the exact same position.\n    const normalized = Math.max(0, Math.min(359.999, Number(spinAngle ?? (winner === "red" ? 270 : 90))));\n    return 1800 + normalized;\n  };'''
          if old_fn in s: s = s.replace(old_fn, new_fn)
          s = s.replace('if (isSpinning && winner) {', 'if ((isSpinning || gameState === "RESULT") && winner) {')
          s = s.replace('  }, [isSpinning, winner]);', '  }, [isSpinning, gameState, winner, spinAngle]);')
          p.write_text(s)

          p = Path('src/app/components/ResponsiveLayout.tsx')
          s = p.read_text()
          s = s.replace('interface ResponsiveLayoutProps {\n  children: ReactNode;\n}', 'interface ResponsiveLayoutProps {\n  children: ReactNode;\n  hideFloatingOnlineCounter?: boolean;\n}')
          s = s.replace('export function ResponsiveLayout({ children }: ResponsiveLayoutProps) {', 'export function ResponsiveLayout({ children, hideFloatingOnlineCounter = false }: ResponsiveLayoutProps) {')
          s = s.replace('      <FloatingOnlineCounter />', '      {!hideFloatingOnlineCounter && <FloatingOnlineCounter />}')
          p.write_text(s)

          p = Path('src/app/pages/Wallet.tsx')
          s = p.read_text()
          s = s.replace('{ label: "Platform Reference", value:', '{ label: "Transaction ID", value:')
          s = s.replace('{ label: "Platform Reference", value:', '{ label: "Transaction ID", value:')
          s = s.replace('tx.metadata?.gameType ? { label: "Game", value: tx.metadata.gameType.replace(/_/g, " ") } : null,', 'tx.metadata?.gameType ? { label: "Game", value: ({ color_game: "Colour Prediction", color_prediction: "Colour Prediction", spin_battle: "Spin Battle", dice_clash: "Dice Clash", dice_royale: "Dice Royale", dice_arena: "Dice Arena", reaction_tap: "Reaction Tap", coin_flip: "Coin Flip" } as Record<string,string>)[tx.metadata.gameType] ?? tx.metadata.gameType.replace(/_/g, " ") } : null,')
          s = s.replace('tx.metadata?.lobby ? { label: "Lobby", value: `Lobby ${tx.metadata.lobby}` } : null,\n                            tx.metadata?.stake ? { label: "Room", value: formatCurrency(tx.metadata.stake) } : null,', 'tx.metadata?.lobby ? { label: "Lobby", value: `Lobby ${tx.metadata.lobby}` } : null,\n                            !tx.metadata?.lobby && tx.metadata?.stake ? { label: "Stake Room", value: formatCurrency(tx.metadata.stake) } : null,')
          p.write_text(s)

      - name: Build
        run: npm ci && npm run build
      - name: Commit fixes and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-color-prediction-issues.yml
          git add src/app/pages/ColorGame.tsx src/app/components/WheelSpinner.tsx src/app/components/ResponsiveLayout.tsx src/app/pages/Wallet.tsx
          git commit -m 'Fix Color Prediction wheel sync, void state and UI'
          git push
