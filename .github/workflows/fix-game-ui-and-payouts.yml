name: Apply game payout and header corrections

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/game-fix.py
