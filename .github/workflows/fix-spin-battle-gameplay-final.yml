name: Fix Spin Battle gameplay final
on:
  push:
    paths:
      - '.github/workflows/fix-spin-battle-gameplay-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gameplay and parent state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/app/components/SpinBattleGameplay.tsx')
          s=p.read_text()
          s=s.replace('const history=serverHistory.length?serverHistory:userHistory;', 'const history=(lobbyState.history && lobbyState.history.length ? lobbyState.history : serverHistory.length ? serverHistory : userHistory);')
          s=s.replace('const iconRadius=58,', 'const iconRadius=50,')
          s=s.replace('function avatarValue(player: SpinPlayer) { return player.avatar || player.username?.charAt(0)?.toUpperCase() || "?"; }', 'function avatarValue(player: SpinPlayer, currentUserId?: string, currentAvatar?: string | null) { return currentUserId && player.userId === currentUserId && currentAvatar ? currentAvatar : (player.avatar || player.username?.charAt(0)?.toUpperCase() || "?"); }')
          s=s.replace('avatarValue(p)', 'avatarValue(p, identity.userId, identity.avatar)')
          s=s.replace('avatarValue(winner)', 'avatarValue(winner, identity.userId, identity.avatar)')
          p.write_text(s)

          pp=Path('src/app/pages/SpinBattle.tsx')
          t=pp.read_text()
          if 'history?: Array<{ roundNumber:number; lobbyId:string|null;' not in t:
              t=t.replace('  recentWinners: BackendWinner[];\n', '  recentWinners: BackendWinner[];\n  history?: Array<{ roundNumber:number; lobbyId:string|null; betAmount:number; won:boolean|null; payout:number; timestamp:number }>;\n', 1)
          if 'if (Array.isArray(data.history)) setUserHistory(data.history);' not in t:
              t=t.replace('    setLobbyState(data);', '    setLobbyState(data);\n    if (Array.isArray(data.history)) setUserHistory(data.history);', 1)
          t=re.sub(r'\n\s*setUserHistory\(prev => prev\.map\(h =>\n\s*h\.roundNumber === data\.roundNumber\n\s*\? \{ \.\.\.h, won: iWon, payout: iWon \? payout : 0 \}\n\s*: h\n\s*\)\);', '', t, count=1)
          t=re.sub(r'\n\s*if \(lobbyState\) \{\n\s*setUserHistory\(prev => \[\{.*?\}, \.\.\.prev\]\);\n\s*\}', '', t, count=1, flags=re.S)
          t=re.sub(r'\n\s*// Save user history to localStorage\n\s*useEffect\(\(\) => \{.*?\n\s*\}, \[userHistory, selectedLobby\]\);', '', t, count=1, flags=re.S)
          pp.write_text(t)
          PY
      - name: Build frontend
        run: |
          npm install
          npm run build
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-spin-battle-gameplay-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/components/SpinBattleGameplay.tsx src/app/pages/SpinBattle.tsx .github/workflows/fix-spin-battle-gameplay-final.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: finalize Spin Battle gameplay state'
          git push
