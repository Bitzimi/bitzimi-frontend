name: Fix Color UI
on:
  push:
    paths:
      - '.github/workflows/fix-color-ui.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply UI cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('src/app/pages/ColorGame.tsx')
          s = p.read_text()
          s = re.sub(r'\n    lobbyPlayers: data\.lobbyPlayers \?\? 0,', '', s)
          old = 'history:     (data.history ?? [])\n      .filter((h: any) => h.result)\n      .map((h: any) => ({ roundNumber: h.roundNumber, winner: h.result, timestamp: new Date(h.timestamp).getTime() })),'
          new = 'history:     (data.history ?? [])\n      .filter((h: any) => h.result)\n      .sort((a: any, b: any) => Number(b.roundNumber) - Number(a.roundNumber))\n      .slice(0, 10)\n      .map((h: any) => ({ roundNumber: h.roundNumber, winner: h.result, timestamp: new Date(h.timestamp).getTime(), voided: h.voided === true })),'
          if old in s: s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-color-ui.yml
          git add src/app/pages/ColorGame.tsx src/app/components/WheelSpinner.tsx
          git commit -m 'Fix Color Prediction UI result feed and lobby badge'
          git push
