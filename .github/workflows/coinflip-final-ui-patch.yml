name: Coin Flip final UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[coinflip-ui-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch searchable button affordance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/app/pages/PvPCoinFlipGame.tsx')
          s = p.read_text()
          pattern = r'(<Button[^>]*onClick=\{startSearch\}[^>]*className=")[^"]*(")'
          replacement = r'\1h-12 min-w-[160px] px-5 rounded-xl border border-gray-400/70 dark:border-gray-500/70 bg-transparent hover:bg-white/10 dark:hover:bg-white/5 hover:border-gray-600 dark:hover:border-gray-300 shadow-sm transition-all\2'
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1: raise SystemExit('search button pattern not found')
          p.write_text(s2)
          PY
      - name: Verify frontend build
        run: npm install && npm run build
      - name: Commit patch
        run: |
          git config user.name "Bitzimi"
          git config user.email "noreply.bitzimi@gmail.com"
          git add src/app/pages/PvPCoinFlipGame.tsx
          git commit -m "fix: make Coin Flip search button visibly actionable [coinflip-ui-patched]"
          git push
