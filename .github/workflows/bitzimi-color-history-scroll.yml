name: BitZimi one-time Color history scroll fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Constrain personal bet history panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/pages/ColorGame.tsx')
          s=p.read_text()
          old='''{activeTab === "your" ? (\n            betHistory.length > 0 ? (\n              <div className="space-y-2">\n                {betHistory.map((bet: any) => ('''
          new='''{activeTab === "your" ? (\n            betHistory.length > 0 ? (\n              <div className="space-y-2 max-h-80 overflow-y-auto pr-1">\n                {betHistory.map((bet: any) => ('''
          if old not in s: raise SystemExit('Color history UI target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove workflow
        run: rm -f .github/workflows/bitzimi-color-history-scroll.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/pages/ColorGame.tsx .github/workflows/bitzimi-color-history-scroll.yml
          git commit -m 'Add scrollable Color Prediction bet history' || exit 0
          git push
