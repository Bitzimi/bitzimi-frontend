name: Finalize transaction history UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[transaction-ui-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair helper scope
        run: python3 scripts/repair_transaction_detail_scope.py
      - name: Build
        run: npm install && npm run build
      - name: Commit finalized renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/Wallet.tsx
          git diff --cached --quiet || git commit -m "Finalize transaction-specific detail renderer [transaction-ui-final]"
          git push origin HEAD:main
