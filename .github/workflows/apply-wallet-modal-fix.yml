name: Apply Wallet Game Transaction Modal Fix
on:
  push:
    branches: [fix/wallet-game-transaction-modal]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch All Transactions modal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/pages/Wallet.tsx')
          s = p.read_text()
          marker = '                    const txDate = new Date(tx.createdAt);\n                    return (\n                      <div key={tx.id}>'
          replacement = '                    const txDate = new Date(tx.createdAt);\n                    const gameView = getGameTransactionView(tx);\n                    return (\n                      <div key={tx.id}>'
          if marker not in s: raise SystemExit('All Transactions modal row marker not found')
          s = s.replace(marker, replacement, 1)
          old = '''                                tx.metadata?.method ? { label: "Method", value: tx.metadata.method } : null,\n                                tx.metadata?.network ? { label: "Network", value: tx.metadata.network } : null,'''
          new = '''                                gameView ? { label: "Game", value: gameView.game } : null,\n                                gameView?.contextLabel ? { label: gameView.contextLabel, value: gameView.contextValue } : null,\n                                tx.metadata?.method ? { label: "Method", value: tx.metadata.method } : null,\n                                tx.metadata?.network ? { label: "Network", value: tx.metadata.network } : null,'''
          if old not in s: raise SystemExit('All Transactions modal detail marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/Wallet.tsx
          git diff --cached --quiet || (git commit -m "Fix game transaction display in all transactions modal" && git push)
# trigger
