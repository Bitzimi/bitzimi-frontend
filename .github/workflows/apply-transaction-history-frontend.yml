name: Upgrade transaction history frontend
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: contains(github.event.head_commit.message, 'Upgrade transaction history frontend') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch transaction history
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f"Pattern not found in {path}: {old[:100]}")
              p.write_text(s.replace(old,new,1))

          p=Path('src/app/contexts/TransactionContext.tsx'); s=p.read_text()
          old='''    referral_earned: "referral_bonus", affiliate_earned: "referral_bonus",
              affiliate_commission: "referral_bonus", commission: "referral_bonus",
              vip_purchase: "withdrawal", streak_reward: "deposit",'''
          new='''    referral_earned: "referral_bonus", affiliate_earned: "affiliate_commission",
              affiliate_commission: "affiliate_commission", ambassador_commission: "ambassador_commission", commission: "affiliate_commission",
              vip_purchase: "vip_purchase", streak_reward: "streak_reward", challenge_reward: "challenge_reward",
              vip_grant: "vip_grant", featured_payment: "featured_payment", featured_refund: "featured_refund", auction_bid: "auction_bid",'''
          replace_once(p,old,new)
          old='''  | "task_reward" | "referral_bonus";'''
          new='''  | "task_reward" | "referral_bonus" | "affiliate_commission" | "ambassador_commission" | "vip_purchase" | "streak_reward" | "challenge_reward" | "vip_grant" | "featured_payment" | "featured_refund" | "auction_bid";'''
          replace_once(p,old,new)

          p=Path('src/app/pages/Wallet.tsx'); s=p.read_text()
          old='''const getTransactionTypeLabel = (type: string) => {

          const labels: Record<string, string> = {

          deposit: "Deposit",
          withdrawal: "Withdrawal",
          transfer: "Transfer",
          game_win: "Game Win",
          game_bet: "Game Bet",
          task_reward: "Task Reward",
          referral_bonus: "Referral Bonus",
          vip_purchase: "VIP Subscription",
          affiliate_commission: "Affiliate Commission",
          streak_reward: "Daily Streak Reward",
          };'''
          new='''const getTransactionTypeLabel = (type: string) => {

          const labels: Record<string, string> = {

          deposit: "Deposit", withdrawal: "Withdrawal", transfer: "Transfer",
          game_win: "Game Win", game_loss: "Game Loss", game_bet: "Game Bet", game_void: "Game Void",
          task_reward: "Task Reward", referral_bonus: "Referral Bonus",
          affiliate_commission: "Affiliate Commission", ambassador_commission: "Ambassador Reward",
          vip_purchase: "VIP Subscription", streak_reward: "VIP Daily Streak Reward",
          challenge_reward: "Monthly Challenge Reward", vip_grant: "VIP Grant",
          featured_payment: "Featured Placement Payment", featured_refund: "Featured Placement Refund", auction_bid: "Auction Bid",
          };'''
          replace_once(p,old,new)
          old='''const isDebit = tx.type === "withdrawal" || tx.type === "game_bet" || tx.type === "vip_purchase";'''
          new='''const isDebit = tx.type === "withdrawal" || tx.type === "game_bet" || tx.type === "vip_purchase" || tx.type === "featured_payment" || tx.type === "auction_bid" || (tx.type === "transfer" && !!tx.metadata?.fromWallet && tx.metadata?.fromWallet !== tx.metadata?.toWallet);'''
          replace_once(p,old,new)
          start=s.index('''{isExpanded && (

          <div className="px-4 pb-4 pt-3 bg-muted/30 dark:bg-white/[0.02] border-t border-border">''')
          end=s.index('''

          </div>

          )}

          </div>

          );''', start)
          newblock='''{isExpanded && (

          <div className="px-4 pb-4 pt-3 bg-muted/30 dark:bg-white/[0.02] border-t border-border">

          <div className="space-y-2">

          {(() => {
          const m = tx.metadata || {};
          const gameNames: Record<string,string> = { color_game: "Colour Prediction", color_prediction: "Colour Prediction", spin_battle: "Spin Battle", dice_clash: "Dice Clash", dice_royale: "Dice Royale", dice_arena: "Dice Arena", pvp_coinflip: "Coin Flip", coin_flip: "Coin Flip", reaction_tap: "Reaction Tap" };
          const walletLabel = (v: any) => String(v ?? "").replace(/_/g, " ").replace(/\\b\\w/g, c => c.toUpperCase());
          const referenceId = m.txHash || m.referenceCode || m.referenceId || m.referenceRecordId || null;
          const rows: Array<{label:string; value:any}> = [
          { label: "Transaction ID", value: <span className="font-mono text-xs break-all">{`tx_${new Date(tx.createdAt).getTime()}_${String(tx.id).replace(/-/g, "").slice(-9)}`}</span> },
          { label: "Type", value: getTransactionTypeLabel(tx.type) },
          { label: "Amount", value: <span className="font-semibold">{formatCurrency(tx.amount)}</span> },
          { label: "Status", value: getStatusBadge(tx.status) },
          ];
          if (tx.type === "transfer") { if (m.fromWallet) rows.push({ label: "From", value: `${walletLabel(m.fromWallet)} Wallet` }); if (m.toWallet) rows.push({ label: "To", value: `${walletLabel(m.toWallet)} Wallet` }); }
          if (["game_win","game_loss","game_bet","game_void"].includes(tx.type)) {
            if (m.gameType) rows.push({ label: "Game", value: gameNames[m.gameType] || walletLabel(m.gameType) });
            const lobby = m.lobby ?? m.lobbyName ?? m.lobbyId;
            const stake = m.stakeRoom ?? m.stake ?? m.stakeAmount ?? m.roomStake;
            if (lobby != null) rows.push({ label: "Lobby", value: `Lobby ${String(lobby).replace(/^Lobby\\s*/i, "")}` });
            else if (stake != null) rows.push({ label: "Stake Room", value: formatCurrency(Number(stake)) });
            if (m.roundNumber != null) rows.push({ label: "Round", value: String(m.roundNumber) });
            if (m.team) rows.push({ label: "Selection", value: walletLabel(m.team) });
            if (m.placement) rows.push({ label: "Placement", value: `${m.placement}${m.placement === 1 ? "st" : m.placement === 2 ? "nd" : m.placement === 3 ? "rd" : "th"} Place` });
            if (m.payout != null && tx.type === "game_win") rows.push({ label: "Payout", value: formatCurrency(Number(m.payout)) });
          }
          if (tx.type === "withdrawal") {
            if (m.method) rows.push({ label: "Method", value: walletLabel(m.method) });
            if (m.destination) rows.push({ label: m.method === "bank" ? "Destination" : "Wallet Address", value: m.destination });
            if (m.walletDebits) rows.push({ label: "Source Wallets", value: Object.entries(m.walletDebits).filter(([,v]) => Number(v)>0).map(([k,v]) => `${walletLabel(k)} ${formatCurrency(Number(v))}`).join(", ") });
          }
          if (tx.type === "deposit") {
            if (m.method) rows.push({ label: "Method", value: walletLabel(m.method) });
            if (m.network) rows.push({ label: "Network", value: m.network });
            if (m.paymentAddress) rows.push({ label: "Payment Address", value: m.paymentAddress });
          }
          if (["task_reward","featured_payment","featured_refund"].includes(tx.type)) {
            if (m.taskTitle) rows.push({ label: "Task", value: m.taskTitle });
            if (m.taskId) rows.push({ label: "Task ID", value: m.taskId });
            if (m.taskType) rows.push({ label: "Task Type", value: walletLabel(m.taskType) });
            if (m.rewardAmount != null && tx.type === "task_reward") rows.push({ label: "Reward", value: formatCurrency(Number(m.rewardAmount)) });
            if (m.durationDays) rows.push({ label: "Duration", value: `${m.durationDays} day(s)` });
          }
          if (tx.type === "referral_bonus") { if (m.rewardTrigger) rows.push({ label: "Reward Trigger", value: m.rewardTrigger }); if (m.referredUserId) rows.push({ label: "Referred User", value: m.referredUserId }); }
          if (["affiliate_commission","ambassador_commission"].includes(tx.type)) { if (m.tier != null) rows.push({ label: "Tier", value: `Tier ${m.tier}` }); if (m.eventType) rows.push({ label: "Event", value: walletLabel(m.eventType) }); if (m.rate != null) rows.push({ label: "Rate", value: `${Number(m.rate) * 100}%` }); if (m.sourceUserId) rows.push({ label: "Source User", value: m.sourceUserId }); }
          if (tx.type === "vip_purchase") { rows.push({ label: "Subscription", value: m.subscriptionType || "VIP" }); if (m.subscriptionPlan) rows.push({ label: "Plan", value: m.subscriptionPlan }); if (m.durationDays) rows.push({ label: "Duration", value: `${m.durationDays} days` }); if (m.fromWallet) rows.push({ label: "From", value: `${walletLabel(m.fromWallet)} Wallet` }); }
          if (tx.type === "streak_reward") { if (m.streakDay != null) rows.push({ label: "Streak Day", value: `Day ${m.streakDay}` }); if (m.destinationWallet) rows.push({ label: "To", value: `${walletLabel(m.destinationWallet)} Wallet` }); }
          if (tx.type === "challenge_reward") { if (m.challengeTitle) rows.push({ label: "Challenge", value: m.challengeTitle }); if (m.level) rows.push({ label: "Level", value: walletLabel(m.level) }); if (m.rank != null) rows.push({ label: "Rank", value: `#${m.rank}` }); if (m.pool != null) rows.push({ label: "Prize Pool", value: formatCurrency(Number(m.pool)) }); }
          if (tx.type === "vip_grant") { if (m.durationDays) rows.push({ label: "Duration", value: `${m.durationDays} days` }); if (m.reason) rows.push({ label: "Reason", value: m.reason }); if (m.grantedBy) rows.push({ label: "Granted By", value: m.grantedBy }); }
          if (tx.type === "auction_bid") { if (m.title) rows.push({ label: "Auction", value: m.title }); if (m.bidNumber) rows.push({ label: "Bid Number", value: `#${m.bidNumber}` }); if (m.auctionId) rows.push({ label: "Auction ID", value: m.auctionId }); }
          if (referenceId) rows.push({ label: "Reference ID", value: <span className="flex items-center gap-2 justify-end"><span className="font-mono text-xs break-all">{referenceId}</span><button type="button" className="shrink-0 text-primary hover:opacity-80" onClick={(e) => { e.stopPropagation(); navigator.clipboard?.writeText(String(referenceId)); toast.success("Reference ID copied"); }} aria-label="Copy reference ID"><Copy className="h-3.5 w-3.5" /></button></span> });
          rows.push({ label: "Date & Time", value: txDate.toLocaleString() });
          return rows.map((row, i) => <div key={i} className="flex justify-between items-start gap-4 text-xs"><span className="text-muted-foreground shrink-0">{row.label}</span><span className="font-medium text-right">{row.value}</span></div>);
          })()}

          </div>

          </div>

          )}'''
          s=s[:start]+newblock+s[end:]
          p.write_text(s)
          PY
          python3 /tmp/patch.py
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-transaction-history-frontend.yml
          git add src/app/contexts/TransactionContext.tsx src/app/pages/Wallet.tsx
          git commit -m "Upgrade transaction history frontend"
          git push
