name: Final Coin Flip Syntax Fix

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix missing synchronized phase closure
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/pages/PvPCoinFlipGame.tsx')
          s = p.read_text()
          bad = '''        scheduleMatchPhase(md, COIN_FLIP_PHASE_MS.popup, () => { setShowResultPopup(true); });\n      });\n  };'''
          good = '''        scheduleMatchPhase(md, COIN_FLIP_PHASE_MS.popup, () => { setShowResultPopup(true); });\n      });\n    });\n  };'''
          assert bad in s, 'Expected final lifecycle closure not found'
          p.write_text(s.replace(bad, good, 1))
      - name: Commit final syntax fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/PvPCoinFlipGame.tsx
          git diff --cached --check
          git commit -m "Fix Coin Flip lifecycle closure" || exit 0
          git push
