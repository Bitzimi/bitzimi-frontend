name: Coin Flip UI verification
on:
  push:
    branches: [main]
    paths:
      - 'src/app/pages/PvPCoinFlipGame.tsx'
      - 'src/app/components/ProfessionalGoldCoin.tsx'
      - '.github/workflows/coinflip-ui-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[coinflip-ui-verified]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Coin Flip avatar fallbacks
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/app/pages/PvPCoinFlipGame.tsx')
          s=p.read_text()
          s=s.replace('homePlayer.avatar ?? undefined','homePlayer.avatar ?? "?"')
          s=s.replace('awayPlayer.avatar ?? undefined','awayPlayer.avatar ?? "?"')
          p.write_text(s)
      - name: Verify Coin Flip invariants
        shell: python
        run: |
          from pathlib import Path
          s=Path('src/app/pages/PvPCoinFlipGame.tsx').read_text()
          for x in ['const totalPool = matchData ? Number(matchData.totalPool ?? 0) : 0;','const winnerPayout = matchData ? Number(matchData.payout ?? matchData.result?.payout ?? 0) : 0;','Search for New Opponent','Back to Stake Room','bg-transparent']:
              if x not in s: raise SystemExit(f'Missing invariant: {x}')
          for x in ['localStorage.getItem','localStorage.setItem','localStorage.removeItem','localStorage.clear']:
              if x in s: raise SystemExit(f'Forbidden Coin Flip storage call: {x}')
      - name: Build frontend
        run: |
          npm install
          npm run build
      - name: Commit normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/pages/PvPCoinFlipGame.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: normalize Coin Flip avatar fallbacks [coinflip-ui-verified]'
          git push
