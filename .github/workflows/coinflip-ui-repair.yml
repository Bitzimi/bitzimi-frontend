name: Coin Flip UI repair

on:
  push:
    branches: [main]
    paths:
      - 'src/app/pages/PvPCoinFlipGame.tsx'
      - 'src/app/components/ProfessionalGoldCoin.tsx'
      - '.github/workflows/coinflip-ui-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[coinflip-ui-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Coin Flip presentation and authoritative display
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/pages/PvPCoinFlipGame.tsx')
          s = p.read_text()
          old = '''  const totalPool = Number(matchData?.totalPool ?? stakeAmount * 2);\n  const platformFee = Number(matchData?.platformFee ?? totalPool * config.feeRate);\n  const winnerPayout = Number(matchData?.payout ?? Math.max(0, totalPool - platformFee));'''
          new = '''  const totalPool = matchData ? Number(matchData.totalPool ?? 0) : 0;\n  const platformFee = matchData ? Number(matchData.platformFee ?? 0) : 0;\n  const winnerPayout = matchData ? Number(matchData.payout ?? matchData.result?.payout ?? 0) : 0;'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const totalPool = matchData ? Number(matchData.totalPool ?? 0);' not in s:
              raise SystemExit('Pool calculation block not found')
          old = '''      <div className="flex items-center justify-between mb-6"><div className="flex flex-col items-center"><div className="w-14 h-14 md:w-16 md:h-16 rounded-full overflow-hidden mb-2"><PlayerAvatar avatar={identity.avatar} /></div><div className="text-xs text-gray-600 dark:text-gray-400 font-medium">{identity.username}</div></div><div className="flex-1 mx-4 text-center"><div className="text-xs text-gray-600 dark:text-gray-400 bg-gray-200 dark:bg-gray-800/50 rounded px-3 py-1 inline-block">Balance: {formatCurrencyNoDecimals(balances.game)}</div></div><div className="flex flex-col items-center"><div className="w-14 h-14 md:w-16 md:h-16 rounded-full overflow-hidden mb-2"><PlayerAvatar avatar={opponent?.avatar ?? opponent?.username?.charAt(0).toUpperCase() ?? \"P\"} /></div><div className="text-xs text-gray-600 dark:text-gray-400 font-medium">{opponent?.username ?? \"Opponent\"}</div></div></div>'''
          new = '''      <div className="flex items-center justify-between mb-6"><div className="flex flex-col items-center"><div className="w-14 h-14 md:w-16 md:h-16 rounded-full overflow-hidden mb-2"><PlayerAvatar avatar={identity.avatar} /></div><div className="text-xs text-gray-600 dark:text-gray-400 font-medium">{identity.username}</div></div><div className="flex-1 mx-4 text-center"><div className="text-xs text-gray-600 dark:text-gray-400 bg-gray-200 dark:bg-gray-800/50 rounded px-3 py-1 inline-block">Balance: {formatCurrencyNoDecimals(balances.game)}</div></div>{opponent ? <div className="flex flex-col items-center"><div className="w-14 h-14 md:w-16 md:h-16 rounded-full overflow-hidden mb-2"><PlayerAvatar avatar={opponent.avatar ?? opponent.username?.charAt(0).toUpperCase()} /></div><div className="text-xs text-gray-600 dark:text-gray-400 font-medium">{opponent.username}</div></div> : <div className="w-14 md:w-16" />}</div>'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'opponent ? <div className="flex flex-col items-center"' not in s:
              raise SystemExit('Opponent presentation block not found')
          old = '''{gameState === "ready" && <div className="text-center"><Button onClick={startSearch} className="h-12 min-w-[190px] px-7 rounded-lg"><Search className="h-4 w-4 mr-2" />Search for Opponent</Button><div className="text-xs text-gray-500 mt-3">Matchmaking and stake handling are controlled by the backend.</div></div>}'''
          new = '''{gameState === "ready" && <div className="flex items-center justify-center"><Button variant="ghost" onClick={startSearch} className="h-12 min-w-[160px] px-8 rounded-lg bg-transparent border border-transparent hover:bg-transparent hover:border-gray-300 dark:hover:border-gray-700"><Search className="h-4 w-4 mr-2" />Search</Button></div>}'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'className="h-12 min-w-[160px] px-8 rounded-lg bg-transparent' not in s:
              raise SystemExit('Idle Search control not found')
          if 'Search for New Opponent' not in s:
              marker = '  </ResponsiveLayout>'
              if marker not in s:
                  raise SystemExit('ResponsiveLayout closing marker not found')
              popup = '''\n      {showResultPopup && matchData?.status === "settled" && (\n        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4 backdrop-blur-sm">\n          <div className="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-6 shadow-2xl dark:border-gray-700 dark:bg-gray-950">\n            <div className="text-center">\n              <div className={`mx-auto mb-3 flex h-16 w-16 items-center justify-center rounded-full text-3xl ${matchData.youWon ? "bg-green-100 dark:bg-green-900/30" : "bg-red-100 dark:bg-red-900/30"}`}>{matchData.youWon ? "🏆" : ""}</div>\n              <h2 className="text-2xl font-bold text-gray-900 dark:text-white">{matchData.youWon ? "You Won!" : "You Lost"}</h2>\n              <p className="mt-2 text-sm text-gray-600 dark:text-gray-400">{opponent?.username ? `vs ${opponent.username}` : "Coin Flip Match"}</p>\n              <div className="mt-5 rounded-xl bg-gray-50 p-4 dark:bg-gray-900">\n                <div className="grid grid-cols-2 gap-3 text-sm">\n                  <div><div className="text-gray-500">Result</div><div className="font-bold uppercase text-gray-900 dark:text-white">{coinResult ?? "—"}</div></div>\n                  <div><div className="text-gray-500">Winner receives</div><div className="font-bold text-gray-900 dark:text-white">{formatCurrencyNoDecimals(winnerPayout)}</div></div>\n                  <div><div className="text-gray-500">Pool</div><div className="font-bold text-gray-900 dark:text-white">{formatCurrencyNoDecimals(totalPool)}</div></div>\n                  <div><div className="text-gray-500">Your result</div><div className="font-bold text-gray-900 dark:text-white">{netChange >= 0 ? "+" : "-"}{formatCurrencyNoDecimals(Math.abs(netChange))}</div></div>\n                </div>\n              </div>\n              <div className="mt-5 space-y-2">\n                <Button onClick={handleNewSearch} className="w-full rounded-xl">Search for New Opponent</Button>\n                <Button variant="outline" onClick={handleExit} className="w-full rounded-xl">Back to Stake Room</Button>\n              </div>\n            </div>\n          </div>\n        </div>\n      )}\n'''
              s = s.replace(marker, popup + marker, 1)
          p.write_text(s)

      - name: Verify source invariants
        shell: python
        run: |
          from pathlib import Path
          s = Path('src/app/pages/PvPCoinFlipGame.tsx').read_text()
          required = [
            'const totalPool = matchData ? Number(matchData.totalPool ?? 0) : 0;',
            'const winnerPayout = matchData ? Number(matchData.payout ?? matchData.result?.payout ?? 0) : 0;',
            'Search for New Opponent',
            'bg-transparent',
          ]
          for item in required:
              if item not in s:
                  raise SystemExit(f'Missing invariant: {item}')
          for forbidden in ['localStorage.getItem', 'localStorage.setItem', 'localStorage.removeItem', 'localStorage.clear']:
              if forbidden in s:
                  raise SystemExit(f'Forbidden Coin Flip browser storage call: {forbidden}')

      - name: Build frontend
        run: |
          npm install
          npm run build

      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/pages/PvPCoinFlipGame.tsx
          if git diff --cached --quiet; then
            echo 'No Coin Flip source changes required.'
            exit 0
          fi
          git commit -m 'fix: restore Coin Flip UI and backend-only pool display [coinflip-ui-repair]'
          git push
