name: Fix Color Prediction Issues 2
on:
  push:
    branches: [fix/color-prediction-round-wheel-wallet-ui]
    paths:
      - '.github/workflows/fix-color-prediction-issues-2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('src/app/pages/ColorGame.tsx'); s=p.read_text()
          s=s.replace('<ResponsiveLayout>', '<ResponsiveLayout hideFloatingOnlineCounter>')
          if 'spinAngle:' not in s:
            s=s.replace('roundId:          (data.roundId ?? null) as string | null,', 'roundId:          (data.roundId ?? null) as string | null,\n    spinAngle:         typeof data.spinAngle === "number" ? data.spinAngle : null,')
          s=s.replace('<WheelSpinner isSpinning={isSpinning} winner={gameState.winner} timeRemaining={gameState.timeRemaining} gameState={gameState.state} roundNumber={gameState.roundNumber} />','<WheelSpinner isSpinning={isSpinning} winner={gameState.winner} spinAngle={gameState.spinAngle} timeRemaining={gameState.timeRemaining} gameState={gameState.state} roundNumber={gameState.roundNumber} />')
          s=s.replace('<div className="flex gap-2 flex-wrap">','<div className="grid grid-cols-5 gap-3 w-fit mx-auto">')
          p.write_text(s)

          p=Path('src/app/components/WheelSpinner.tsx'); s=p.read_text()
          if 'spinAngle?: number | null;' not in s: s=s.replace('  roundNumber?: number;\n}', '  roundNumber?: number;\n  spinAngle?: number | null;\n}')
          s=s.replace('export function WheelSpinner({ isSpinning, winner, timeRemaining = 0, gameState = "WAITING", roundNumber }: WheelSpinnerProps) {','export function WheelSpinner({ isSpinning, winner, spinAngle = null, timeRemaining = 0, gameState = "WAITING", roundNumber }: WheelSpinnerProps) {')
          s=re.sub(r'  const getTargetRotation = \(\) => \{.*?\n  \};', '''  const getTargetRotation = () => {\n    if (!winner) return 0;\n    const normalized = Math.max(0, Math.min(359.999, Number(spinAngle ?? (winner === "red" ? 270 : 90))));\n    return 1800 + normalized;\n  };''', s, count=1, flags=re.S)
          s=s.replace('if (isSpinning && winner) {','if ((isSpinning || gameState === "RESULT") && winner) {')
          s=s.replace('  }, [isSpinning, winner]);','  }, [isSpinning, gameState, winner, spinAngle]);')
          p.write_text(s)

          p=Path('src/app/components/ResponsiveLayout.tsx'); s=p.read_text()
          if 'hideFloatingOnlineCounter?: boolean;' not in s: s=s.replace('interface ResponsiveLayoutProps {\n  children: ReactNode;\n}', 'interface ResponsiveLayoutProps {\n  children: ReactNode;\n  hideFloatingOnlineCounter?: boolean;\n}')
          s=s.replace('export function ResponsiveLayout({ children }: ResponsiveLayoutProps) {','export function ResponsiveLayout({ children, hideFloatingOnlineCounter = false }: ResponsiveLayoutProps) {')
          s=s.replace('<FloatingOnlineCounter />','{!hideFloatingOnlineCounter && <FloatingOnlineCounter />}')
          p.write_text(s)

          p=Path('src/app/pages/Wallet.tsx'); s=p.read_text()
          s=s.replace('Platform Reference','Transaction ID')
          s=s.replace('tx.metadata?.lobby ? { label: "Lobby", value: `Lobby ${tx.metadata.lobby}` } : null,\n                            tx.metadata?.stake ? { label: "Room", value: formatCurrency(tx.metadata.stake) } : null,','tx.metadata?.lobby ? { label: "Lobby", value: `Lobby ${tx.metadata.lobby}` } : null,\n                            !tx.metadata?.lobby && tx.metadata?.stake ? { label: "Stake Room", value: formatCurrency(tx.metadata.stake) } : null,')
          p.write_text(s)

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-color-prediction-issues.yml .github/workflows/fix-color-prediction-issues-2.yml || true
          git add src/app/pages/ColorGame.tsx src/app/components/WheelSpinner.tsx src/app/components/ResponsiveLayout.tsx src/app/pages/Wallet.tsx
          git commit -m 'Fix Color Prediction wheel sync and layout' || true
          git push
