name: Repair transaction history UI placement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[transaction-ui-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Wallet.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/app/pages/Wallet.tsx')
          s=p.read_text()
          bad=re.search(r'    // Cleanup on unmount\n(?P<helper>    const getTransactionDetailRows = \(tx: any, txDate: Date\) => \{.*?\n    \};)\n\n  return \(\) => \{',s,re.S)
          if bad:
              helper=bad.group('helper').replace('    const getTransactionDetailRows','  const getTransactionDetailRows',1)
              s=s[:bad.start()]+'    // Cleanup on unmount\n    return () => {'+s[bad.end():]
              idx=s.rfind('  return (')
              if idx < 0: raise SystemExit('Wallet return not found')
              s=s[:idx]+helper+'\n\n'+s[idx:]
          p.write_text(s)
          PY
      - name: Build and commit
        run: |
          npm install
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/Wallet.tsx
          git diff --cached --quiet || git commit -m "Place transaction detail helper correctly [transaction-ui-final]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main