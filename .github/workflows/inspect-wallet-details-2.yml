name: Repair Wallet transaction details
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct helper scope and streak details
        run: python3 scripts/fix_wallet_transaction_helper_scope.py
      - name: Build and commit
        run: |
          npm install
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/Wallet.tsx
          git diff --cached --quiet || git commit -m "Correct transaction detail helper scope [transaction-ui-final]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main