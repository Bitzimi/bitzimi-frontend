name: Repair transaction history UI placement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[transaction-ui-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Wallet.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/app/pages/Wallet.tsx')
          s=p.read_text()
          # Move an already-inserted helper out of the useEffect cleanup and into component scope.
          bad=re.search(r'    // Cleanup on unmount\n(?P<helper>    const getTransactionDetailRows = \(tx: any, txDate: Date\) => \{.*?\n    \};)\n\n  return \(\) => \{', s, re.S)
          if bad:
              helper=bad.group('helper')
              s=s[:bad.start()]+'    // Cleanup on unmount\n    return () => {'+s[bad.end():]
              marker='  return (\n    <ResponsiveLayout>'
              if marker not in s: raise SystemExit('component return marker not found')
              s=s.replace(marker, helper+'\n\n'+marker, 1)
          # If a malformed helper remains inside JSX, remove that copy; the component-scope helper is authoritative.
          s=s.replace('    const getTransactionDetailRows = (tx: any, txDate: Date) => {', '  const getTransactionDetailRows = (tx: any, txDate: Date) => {', 1)
          p.write_text(s)
          PY
      - name: Build and commit
        run: |
          npm install
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/Wallet.tsx
          git diff --cached --quiet || git commit -m "Place transaction detail helper correctly [transaction-ui-final]"
          git push