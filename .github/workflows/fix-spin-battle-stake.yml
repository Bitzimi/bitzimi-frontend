name: Fix Spin Battle undefined stake

on:
  push:
    paths:
      - '.github/workflows/fix-spin-battle-stake.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix undefined stake reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/pages/SpinBattle.tsx')
          s = p.read_text()
          old = '                          <p className="text-sm font-bold text-gray-900 dark:text-white">{formatCurrencyNoDecimals(stake)}</p>'
          new = '''                          <div className="text-right shrink-0">
                            {isMe && lobbyState.myBet?.amount != null ? (
                              <p className="text-sm font-bold text-gray-900 dark:text-white">{formatCurrencyNoDecimals(lobbyState.myBet.amount)}</p>
                            ) : (
                              <p className="text-xs text-gray-500 dark:text-gray-400">In round</p>
                            )}
                          </div>'''
          if old not in s:
              raise SystemExit('Expected SpinBattle stake reference was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/pages/SpinBattle.tsx
          git commit -m 'Fix Spin Battle undefined stake runtime error'
          git push
          git rm .github/workflows/fix-spin-battle-stake.yml
          git commit -m 'Remove temporary Spin Battle hotfix workflow'
          git push
