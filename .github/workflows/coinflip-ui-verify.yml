name: Coin Flip UI Verification

on:
  push:
    paths:
      - 'scripts/**'
      - 'src/app/pages/PvPCoinFlipGame.tsx'
      - 'src/app/services/gameMatchmakingService.ts'
      - 'src/app/components/ProfessionalGoldCoin.tsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final Coin Flip header patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/apply-gameplay-flow-v3.mjs')
          s = p.read_text()
          needle = '  s = s.replaceAll(\'<PlayerAvatar avatar={opponentAvatar} />\', \'<PlayerAvatar avatar={matchData?.opponent?.avatar ?? opponentAvatar} />\');'
          insert = needle + '\n  s = s.replace(\'<div></div>\\n          <div className="flex items-center justify-end"><Button variant="outline" size="sm" onClick={() => setShowFairness(true)} className="flex items-center gap-1.5"><Shield className="h-3.5 w-3.5" />Verify Fairness</Button></div>\', \'<div className="flex items-center justify-start"><Button variant="outline" size="sm" onClick={() => setShowFairness(true)} className="flex items-center gap-1.5"><Shield className="h-3.5 w-3.5" />Verify Fairness</Button></div>\\n          <div></div>\');'
          if 'justify-start' not in s:
              if needle not in s:
                  raise SystemExit('Coin Flip script marker not found')
              s = s.replace(needle, insert, 1)
              p.write_text(s)

      - name: Build frontend
        run: npm install && npm run build

      - name: Commit generated-source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply-gameplay-flow-v3.mjs
          if git diff --cached --quiet; then
            echo 'No source patch needed.'
          else
            git commit -m 'fix: place Coin Flip fairness control under header'
            git push
          fi
