name: Fix transaction-specific UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[transaction-ui-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch transaction detail UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('src/app/pages/Wallet.tsx')
          s=p.read_text()
          marker='  // Transaction History\n'
          helper=r'''  const getTransactionDetailRows = (tx: any, txDate: Date) => {
    const metadata = tx.metadata ?? {};
    const type = String(tx.type ?? "").toLowerCase();
    const gameType = String(metadata.gameType ?? metadata.game ?? metadata.game_type ?? "").toLowerCase().replace(/[-\s]/g, "_");
    const gameNames: Record<string,string> = {
      color_game: "Colour Prediction", color_prediction: "Colour Prediction", colour_prediction: "Colour Prediction",
      spin_battle: "Spin Battle", dice_clash: "Dice Clash", dice_royale: "Dice Royale", dice_arena: "Dice Arena",
      pvp_coinflip: "Coin Flip", coin_flip: "Coin Flip", pvp_coin_flip: "Coin Flip", reaction_tap: "Reaction Tap",
    };
    const walletName = (v: any) => String(v ?? "").replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    const game = gameNames[gameType] ?? (gameType ? walletName(gameType) : null);
    const rows: Array<{label:string; value:any}> = [
      { label: "Transaction ID", value: <span className="font-mono text-xs">{typeof tx.id === "string" ? (tx.id.startsWith("tx_") ? tx.id : `tx_${Date.parse(tx.createdAt)}_${tx.id.replace(/-/g, "").slice(0, 9)}`) : tx.id}</span> },
      { label: "Amount", value: <span className="font-semibold">{formatCurrency(tx.amount)}</span> },
      { label: "Type", value: getTransactionTypeLabel(tx.type) },
      { label: "Status", value: getStatusBadge(tx.status) },
    ];
    if (type === "transfer") {
      if (metadata.fromWallet) rows.push({ label: "From", value: `${walletName(metadata.fromWallet)} Wallet` });
      if (metadata.toWallet) rows.push({ label: "To", value: `${walletName(metadata.toWallet)} Wallet` });
    } else if (type === "deposit") {
      if (metadata.method) rows.push({ label: "Method", value: walletName(metadata.method) });
      if (metadata.network) rows.push({ label: "Network", value: metadata.network });
      if (metadata.bankName) rows.push({ label: "Bank", value: metadata.bankName });
      if (metadata.destinationLabel) rows.push({ label: "To", value: metadata.destinationLabel });
      const ref = metadata.referenceCode;
      if (ref) rows.push({ label: "Reference ID", value: <span className="flex items-center gap-2 justify-end"><span className="font-mono text-xs max-w-[220px] truncate">{String(ref).length > 24 ? `${String(ref).slice(0, 24)}…` : String(ref)}</span><button type="button" className="shrink-0 text-primary hover:opacity-80" onClick={(e) => { e.stopPropagation(); navigator.clipboard?.writeText(String(ref)); toast.success("Reference ID copied"); }} aria-label="Copy reference ID"><Copy className="h-3.5 w-3.5" /></button></span> });
    } else if (type === "withdrawal") {
      if (metadata.method) rows.push({ label: "Method", value: walletName(metadata.method) });
      if (metadata.network) rows.push({ label: "Network", value: metadata.network });
      if (metadata.destination) rows.push({ label: metadata.method === "bank" ? "Bank Account" : "Wallet Address", value: metadata.destination });
      const ref = metadata.referenceCode;
      if (ref) rows.push({ label: "Reference ID", value: <span className="flex items-center gap-2 justify-end"><span className="font-mono text-xs max-w-[220px] truncate">{String(ref).length > 24 ? `${String(ref).slice(0, 24)}…` : String(ref)}</span><button type="button" className="shrink-0 text-primary hover:opacity-80" onClick={(e) => { e.stopPropagation(); navigator.clipboard?.writeText(String(ref)); toast.success("Reference ID copied"); }} aria-label="Copy reference ID"><Copy className="h-3.5 w-3.5" /></button></span> });
      if (metadata.fee != null) rows.push({ label: "Fee", value: formatCurrency(Number(metadata.fee)) });
      if (metadata.netAmount != null) rows.push({ label: "Net Amount", value: formatCurrency(Number(metadata.netAmount)) });
    } else if (type.startsWith("game_")) {
      if (game) rows.push({ label: "Game", value: game });
      const lobby = metadata.lobby ?? metadata.lobbyName ?? metadata.lobbyId;
      const stake = metadata.stakeRoom ?? metadata.stake ?? metadata.stakeAmount ?? metadata.roomStake;
      if (lobby != null && String(lobby).trim() !== "") rows.push({ label: "Lobby", value: `Lobby ${String(lobby).replace(/^Lobby\s*/i, "")}` });
      else if (stake != null && String(stake).trim() !== "") rows.push({ label: "Stake Room", value: `$${Number(stake).toLocaleString()}` });
      if (metadata.roundNumber != null) rows.push({ label: "Round", value: `#${metadata.roundNumber}` });
      if (metadata.team) rows.push({ label: "Selection", value: walletName(metadata.team) });
      if (metadata.placement != null) rows.push({ label: "Placement", value: `#${metadata.placement}` });
    } else if (type === "task_reward") {
      if (metadata.sourceLabel) rows.push({ label: "From", value: metadata.sourceLabel });
      if (metadata.toWallet || metadata.destinationLabel) rows.push({ label: "To", value: metadata.destinationLabel ?? `${walletName(metadata.toWallet)} Wallet` });
      if (metadata.taskType) rows.push({ label: "Task Type", value: walletName(metadata.taskType) });
      if (metadata.taskId) rows.push({ label: "Task ID", value: metadata.taskId });
    } else if (type === "referral_bonus") {
      if (metadata.sourceLabel) rows.push({ label: "From", value: metadata.sourceLabel });
      if (metadata.destinationLabel) rows.push({ label: "To", value: metadata.destinationLabel });
      if (metadata.rewardTrigger) rows.push({ label: "Reward Trigger", value: metadata.rewardTrigger });
    } else if (type === "affiliate_commission" || type === "ambassador_commission") {
      if (metadata.sourceLabel) rows.push({ label: "From", value: metadata.sourceLabel });
      if (metadata.destinationLabel) rows.push({ label: "To", value: metadata.destinationLabel });
      if (metadata.tier != null) rows.push({ label: "Tier", value: `Tier ${metadata.tier}` });
      if (metadata.eventType) rows.push({ label: "Event", value: walletName(metadata.eventType) });
      if (metadata.rate != null) rows.push({ label: "Rate", value: `${Number(metadata.rate) * 100}%` });
    } else if (type === "streak_reward") {
      if (metadata.sourceLabel) rows.push({ label: "From", value: metadata.sourceLabel });
      if (metadata.streakDay != null) rows.push({ label: "Streak Day", value: `Day ${metadata.streakDay}` });
      if (metadata.month) rows.push({ label: "Month", value: metadata.month });
      if (metadata.destinationLabel) rows.push({ label: "To", value: metadata.destinationLabel });
    } else if (type === "vip_purchase") {
      if (metadata.sourceLabel) rows.push({ label: "From", value: metadata.sourceLabel });
      if (metadata.subscriptionType) rows.push({ label: "Subscription", value: metadata.subscriptionType });
      if (metadata.subscriptionPlan) rows.push({ label: "Plan", value: metadata.subscriptionPlan });
      if (metadata.durationDays != null) rows.push({ label: "Duration", value: `${metadata.durationDays} days` });
      if (metadata.destinationLabel) rows.push({ label: "To", value: metadata.destinationLabel });
      if (metadata.method) rows.push({ label: "Method", value: walletName(metadata.method) });
    } else if (type === "challenge_reward") {
      if (metadata.sourceLabel) rows.push({ label: "From", value: metadata.sourceLabel });
      if (metadata.level) rows.push({ label: "Level", value: walletName(metadata.level) });
      if (metadata.rank != null) rows.push({ label: "Rank", value: `#${metadata.rank}` });
      if (metadata.referrals != null) rows.push({ label: "Referrals", value: metadata.referrals });
      if (metadata.pool != null) rows.push({ label: "Prize Pool", value: formatCurrency(Number(metadata.pool)) });
      if (metadata.destinationLabel) rows.push({ label: "To", value: metadata.destinationLabel });
    } else if (type === "vip_grant") {
      if (metadata.sourceLabel) rows.push({ label: "From", value: metadata.sourceLabel });
      if (metadata.durationDays != null) rows.push({ label: "Duration", value: `${metadata.durationDays} days` });
      if (metadata.reason) rows.push({ label: "Reason", value: metadata.reason });
    } else if (metadata.sourceLabel || metadata.destinationLabel) {
      if (metadata.sourceLabel) rows.push({ label: "From", value: metadata.sourceLabel });
      if (metadata.destinationLabel) rows.push({ label: "To", value: metadata.destinationLabel });
    }
    rows.push({ label: "Date & Time", value: txDate.toLocaleString() });
    return rows;
  };

'''
          if marker in s and 'const getTransactionDetailRows' not in s:
              s=s.replace(marker, helper+marker, 1)
          pattern=re.compile(r'\{\[\s*\{ label: "Transaction ID".*?\]\s*\.filter\(Boolean\)\s*\.map\(\(row: any, i\) => \(.*?\n\s*\)\)\}', re.S)
          s,n=pattern.subn('{getTransactionDetailRows(tx, txDate).map((row: any, i) => (\n                                <div key={i} className="flex justify-between items-start gap-4 text-xs">\n                                  <span className="text-muted-foreground shrink-0">{row.label}</span>\n                                  <span className="font-medium text-right">{row.value}</span>\n                                </div>\n                              ))}', s)
          print('DETAIL_BLOCKS_REPLACED', n)
          if n != 2:
              raise SystemExit('Expected exactly 2 transaction detail blocks')
          p.write_text(s)
      - name: Verify and commit
        run: |
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/Wallet.tsx
          git diff --cached --quiet || git commit -m "Fix transaction-specific wallet detail UI [transaction-ui-fixed]"
          git push