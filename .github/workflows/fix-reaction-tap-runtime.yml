name: Fix Reaction Tap runtime reference
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale dependency
        run: python3 -c "from pathlib import Path; p=Path('src/app/pages/ReactionTapGameRoom.tsx'); s=p.read_text(); old='addGameResult, addNotification, formatCurrencyNoDecimals'; new='addGameResult, formatCurrencyNoDecimals'; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/pages/ReactionTapGameRoom.tsx
          git commit -m "Fix Reaction Tap runtime notification reference"
          git push
