name: Apply Spin Battle fixes

on:
  push:
    paths:
      - .github/workflows/apply-spin-battle-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Spin Battle
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/app/components/SpinBattleGameplay.tsx")
          text = path.read_text()

          old = '''function avatarValue(player: SpinPlayer, currentUserId?: string, currentAvatar?: string | null) { return currentUserId && player.userId === currentUserId && currentAvatar ? currentAvatar : (player.avatar || player.username?.charAt(0)?.toUpperCase() || "?"); }'''
          new = '''function avatarValue(player: SpinPlayer) { return player.avatar || player.username?.charAt(0)?.toUpperCase() || "?"; }'''
          text = text.replace(old, new)
          text = text.replace(''' const [rotation,setRotation]=useState(0); const [animating,setAnimating]=useState(false);''', ''' const [rotation,setRotation]=useState(0); const [animating,setAnimating]=useState(false); const [isMobile,setIsMobile]=useState(false);''')
          text = text.replace(''' const wheelRef=useRef<HTMLDivElement|null>(null);''', ''' const wheelRef=useRef<HTMLDivElement|null>(null);\n useEffect(()=>{const mq=window.matchMedia("(max-width: 767px)");const update=()=>setIsMobile(mq.matches);update();mq.addEventListener?.("change",update);return()=>mq.removeEventListener?.("change",update);},[]);''')

          old_effect = ''' useEffect(()=>{const prev=prevPhase.current;prevPhase.current=lobbyState.phase;if(popupTimer.current)clearTimeout(popupTimer.current);if(winnerTimer.current)clearTimeout(winnerTimer.current);
   if(lobbyState.phase==="spinning"&&prev!=="spinning"){setPresentation("spinning");setAnimating(true);requestAnimationFrame(()=>setRotation(r=>r+5*360+270));}
   if(lobbyState.phase==="result"&&prev!=="result"&&winner){setPresentation("winner");setAnimating(true);const center=(winner.segmentStart+winner.segmentEnd)/2;requestAnimationFrame(()=>setRotation(current=>{const currentMod=((current%360)+360)%360;const desired=(360-center+360)%360;const delta=((desired-currentMod)+360)%360;return current+360+delta;}));popupTimer.current=setTimeout(()=>setPresentation("popup"),4000);winnerTimer.current=setTimeout(()=>setAnimating(false),1200);loadHistory();}
   if(lobbyState.phase==="waiting"&&prev==="result")setPresentation("normal");
   return()=>{if(popupTimer.current)clearTimeout(popupTimer.current);if(winnerTimer.current)clearTimeout(winnerTimer.current);};
 },[lobbyState.phase,lobbyState.roundNumber,winner]);'''
          new_effect = ''' useEffect(()=>{const prev=prevPhase.current;prevPhase.current=lobbyState.phase;
   if(lobbyState.phase==="spinning"&&prev!=="spinning"){if(popupTimer.current)clearTimeout(popupTimer.current);if(winnerTimer.current)clearTimeout(winnerTimer.current);setPresentation("spinning");setAnimating(true);requestAnimationFrame(()=>setRotation(r=>r+5*360+270));}
   if(lobbyState.phase==="result"&&prev!=="result"&&lobbyState.winnerId){if(popupTimer.current)clearTimeout(popupTimer.current);if(winnerTimer.current)clearTimeout(winnerTimer.current);setPresentation(winner?"winner":"normal");setAnimating(true);if(winner){const center=(winner.segmentStart+winner.segmentEnd)/2;requestAnimationFrame(()=>setRotation(current=>{const currentMod=((current%360)+360)%360;const desired=(360-center+360)%360;const delta=((desired-currentMod)+360)%360;return current+360+delta;}));}popupTimer.current=setTimeout(()=>setPresentation("popup"),4000);winnerTimer.current=setTimeout(()=>setAnimating(false),1200);loadHistory();}
   if(lobbyState.phase==="waiting"&&prev==="result"){if(popupTimer.current)clearTimeout(popupTimer.current);if(winnerTimer.current)clearTimeout(winnerTimer.current);setPresentation("normal");}
   return()=>{};
 },[lobbyState.phase,lobbyState.roundNumber,lobbyState.winnerId]);'''
          if old_effect not in text:
              raise SystemExit("winner presentation effect pattern not found")
          text = text.replace(old_effect, new_effect)

          text = text.replace('''const iconRadius=50,ax=100+iconRadius*Math.cos(c),ay=100+iconRadius*Math.sin(c),avatar=avatarValue(p, identity.userId, identity.avatar);''', '''const iconRadius=isMobile?74:50,ax=100+iconRadius*Math.cos(c),ay=100+iconRadius*Math.sin(c),avatar=avatarValue(p);''')
          text = text.replace('''<PlayerAvatar avatar={avatarValue(winner, identity.userId, identity.avatar)}/>''', '''<PlayerAvatar avatar={avatarValue(winner)}/>''')
          text = text.replace('''<PlayerAvatar avatar={avatarValue(p, identity.userId, identity.avatar)}/>''', '''<PlayerAvatar avatar={avatarValue(p)}/>''')
          text = text.replace('''<PlayerAvatar avatar={w.winnerId===identity.userId?identity.avatar||avatarValue({userId:w.winnerId??"",username:w.winnerUsername??"?",index:0,avatar:w.avatar,betAmount:0,color:"",segmentStart:0,segmentEnd:0,probability:0}):avatarValue({userId:w.winnerId??"",username:w.winnerUsername??"?",index:0,avatar:w.avatar,betAmount:0,color:"",segmentStart:0,segmentEnd:0,probability:0})}/>''', '''<PlayerAvatar avatar={avatarValue({userId:w.winnerId??"",username:w.winnerUsername??"?",index:0,avatar:w.avatar,betAmount:0,color:"",segmentStart:0,segmentEnd:0,probability:0})}/>''')

          old_center = '''<div className="absolute inset-0 flex items-center justify-center pointer-events-none"><div className="w-36 h-36 rounded-full bg-white dark:bg-gradient-to-br dark:from-gray-900 dark:via-black dark:to-gray-900 border-4 border-gray-300 dark:border-gray-700/50 flex items-center justify-center shadow-2xl">
     {(lobbyState.phase==="countdown"||lobbyState.phase==="locked")&&<p className={`text-5xl font-bold tabular-nums ${(lobbyState.timeRemaining??0)<=5?"text-red-500 animate-pulse":"text-gray-900 dark:text-white"}`}>{lobbyState.timeRemaining??0}</p>}'''
          new_center = '''<div className="absolute inset-0 flex items-center justify-center pointer-events-none"><div className="w-36 h-36 rounded-full bg-white dark:bg-gradient-to-br dark:from-gray-900 dark:via-black dark:to-gray-900 border-4 border-gray-300 dark:border-gray-700/50 flex items-center justify-center shadow-2xl">
     {lobbyState.phase==="waiting"&&ps.length===1&&<p className="text-white text-lg font-semibold">Waiting...</p>}
     {(lobbyState.phase==="countdown"||lobbyState.phase==="locked")&&<p className={`text-5xl font-bold tabular-nums ${(lobbyState.timeRemaining??0)<=5?"text-red-500 animate-pulse":"text-gray-900 dark:text-white"}`}>{lobbyState.timeRemaining??0}</p>}'''
          if old_center not in text:
              raise SystemExit("wheel center pattern not found")
          text = text.replace(old_center, new_center)

          old_header = '''<div className="flex items-center justify-between gap-4"><div className="flex items-baseline gap-[6px]"><h1 className="text-xl font-bold text-gray-900 dark:text-white whitespace-nowrap">Spin Battle</h1><span className="text-sm text-gray-500 whitespace-nowrap">- Lobby {selectedLobby}</span></div><div className="flex items-center gap-2"><Button variant="outline" size="sm" onClick={()=>setFairness(true)}><Shield className="h-3.5 w-3.5 mr-1.5"/>Verify Fairness</Button><Button variant="outline" size="sm" onClick={()=>setRules(true)} className="px-4"><Info className="h-4 w-4 mr-2"/>Rules</Button></div></div><div className="flex items-center gap-2"><p className="text-sm text-gray-500">Round #{lobbyState.roundNumber}</p><div className="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-red-500/10"><div className="relative"><div className="w-1.5 h-1.5 bg-red-500 rounded-full"/><div className="absolute inset-0 w-1.5 h-1.5 bg-red-500 rounded-full animate-ping opacity-75"/></div><span className="text-xs font-semibold text-red-500">Live</span></div></div></div>'''
          new_header = '''<div className="flex items-start justify-between gap-4"><div className="space-y-1"><div className="flex items-baseline gap-[6px]"><h1 className="text-xl font-bold text-gray-900 dark:text-white whitespace-nowrap">Spin Battle</h1><span className="text-sm text-gray-500 whitespace-nowrap">- Lobby {selectedLobby}</span></div><div className="flex items-center gap-2"><p className="text-sm text-gray-500">Round #{lobbyState.roundNumber}</p><div className="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-red-500/10"><div className="relative"><div className="w-1.5 h-1.5 bg-red-500 rounded-full"/><div className="absolute inset-0 w-1.5 h-1.5 bg-red-500 rounded-full animate-ping opacity-75"/></div><span className="text-xs font-semibold text-red-500">Live</span></div></div></div><div className="flex flex-col items-end gap-1"><Button variant="outline" size="sm" onClick={()=>setRules(true)} className="px-4"><Info className="h-4 w-4 mr-2"/>Rules</Button><Button variant="ghost" size="sm" onClick={()=>setFairness(true)} className="px-4"><Shield className="h-3.5 w-3.5 mr-1.5"/>Verify Fairness</Button></div></div>'''
          if old_header not in text:
              raise SystemExit("header pattern not found")
          text = text.replace(old_header, new_header)

          old_stats = '''<div className="grid grid-cols-3 gap-1"><Card><CardContent className="p-5 text-center"><TrendingUp className="h-5 w-5 text-blue-500 mx-auto mb-2"/><p className="text-xs text-gray-600 dark:text-gray-400 mb-1">Total Pool</p><p className="font-bold text-gray-900 dark:text-white text-[13px] sm:text-lg">{formatCurrency(lobbyState.totalPool)}</p></CardContent></Card><Card><CardContent className="p-5 text-center"><Users className="h-5 w-5 text-green-500 mx-auto mb-2"/><p className="text-xs text-gray-600 dark:text-gray-400 mb-1">Players</p><p className="text-2xl font-bold text-gray-900 dark:text-white">{lobbyState.playerCount}</p></CardContent></Card><Card><CardContent className="p-5 text-center"><Sparkles className="h-5 w-5 text-yellow-500 mx-auto mb-2"/><p className="text-xs text-gray-600 dark:text-gray-400 mb-1">Winner Gets</p><p className="font-bold text-gray-900 dark:text-white text-[13px] sm:text-lg">{formatCurrency(lobbyState.winnerPayout??potentialWin)}</p></CardContent></Card></div>'''
          new_stats = '''<Card className="bg-gradient-to-br from-gray-50 to-white dark:from-gray-900 dark:to-gray-800 border border-gray-200 dark:border-gray-800"><div className="p-3 sm:p-4"><div className="grid grid-cols-3 gap-3 sm:gap-4"><div className="text-center"><p className="text-xs text-gray-600 dark:text-gray-400 mb-1">Total Pool</p><p className="text-lg sm:text-2xl font-bold text-gray-900 dark:text-white">{formatCurrency(lobbyState.totalPool)}</p></div><div className="text-center"><p className="text-xs text-gray-600 dark:text-gray-400 mb-1">Players</p><p className="text-lg sm:text-2xl font-bold text-gray-900 dark:text-white">{lobbyState.playerCount}</p></div><div className="text-center"><p className="text-xs text-gray-600 dark:text-gray-400 mb-1">Winner Gets</p><p className="text-lg sm:text-2xl font-bold text-gray-900 dark:text-white">{formatCurrency(lobbyState.winnerPayout??potentialWin)}</p></div></div></div></Card>'''
          if old_stats not in text:
              raise SystemExit("stats pattern not found")
          text = text.replace(old_stats, new_stats)

          # Remove the temporary current-user avatar override from all remaining call sites.
          text = text.replace('avatarValue(p, identity.userId, identity.avatar)', 'avatarValue(p)')
          text = text.replace('avatarValue(winner, identity.userId, identity.avatar)', 'avatarValue(winner)')

          path.write_text(text)
          PY

      - name: Verify frontend build
        run: |
          npm ci
          npm run build

      - name: Commit fixes and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/SpinBattleGameplay.tsx
          git rm .github/workflows/apply-spin-battle-fixes.yml
          git commit -m "fix: complete Spin Battle identity and result presentation"
          git push origin HEAD:main
