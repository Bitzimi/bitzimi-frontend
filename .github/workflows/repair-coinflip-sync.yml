name: Repair Coin Flip Sync Patch

on:
  push:
    branches: [main]

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair synchronized lifecycle code
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/pages/PvPCoinFlipGame.tsx')
          s = p.read_text()
          replacements = [
              ('        scheduleMatchPhase(md, COIN_FLIP_PHASE_MS.popup, () => { setShowResultPopup(true); });\n      }, 2000);',
               '        scheduleMatchPhase(md, COIN_FLIP_PHASE_MS.popup, () => { setShowResultPopup(true); });\n      });'),
              ('        scheduleMatchPhase(md, COIN_FLIP_PHASE_MS.popup, () => { setShowResultPopup(true); });\n      });\n    }, 2500);',
               '        scheduleMatchPhase(md, COIN_FLIP_PHASE_MS.popup, () => { setShowResultPopup(true); });\n      });'),
          ]
          changed = False
          for bad, good in replacements:
              if bad in s:
                  s = s.replace(bad, good, 1)
                  changed = True
          assert changed, 'No targeted lifecycle closure needed repair'
          p.write_text(s)
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/PvPCoinFlipGame.tsx
          git diff --cached --check
          git commit -m "Repair Coin Flip synchronized lifecycle" || exit 0
          git push
