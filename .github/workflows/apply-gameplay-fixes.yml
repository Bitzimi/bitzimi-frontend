name: Apply cross-game gameplay fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply source fixes
        run: node scripts/apply-cross-gameplay-fixes.mjs && node scripts/fix-coinflip-history-build.mjs
      - name: Verify production build
        run: npm install && npm run build
      - name: Commit generated source changes and remove one-time tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts package.json
          git rm -f scripts/apply-cross-gameplay-fixes.mjs scripts/fix-coinflip-history-build.mjs .github/workflows/apply-gameplay-fixes.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: cross-game matchmaking payout and result flow"
          git push origin main
