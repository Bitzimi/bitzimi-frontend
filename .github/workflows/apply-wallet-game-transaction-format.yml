name: Apply wallet game transaction format

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wallet-game-transaction-format.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply wallet game transaction format'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact transaction presentation rules
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/pages/Wallet.tsx')
          s = p.read_text()
          old = '''  const getGameTransactionView = (tx: any) => {
    if (!tx?.type || !["game_win", "game_loss", "game_bet", "game_void"].includes(tx.type)) return null;
    const meta = tx.metadata || {};
    const gameType = String(meta.gameType || meta.game || "").toLowerCase();
    const gameNames: Record<string, string> = {
      color_game: "Colour Prediction", color_prediction: "Colour Prediction",
      spin_battle: "Spin Battle", dice_clash: "Dice Clash", dice_royale: "Dice Royale",
      dice_arena: "Dice Arena", coin_flip: "Coin Flip", pvp_coinflip: "Coin Flip",
      reaction_tap: "Reaction Tap",
    };
    const game = gameNames[gameType] || (gameType ? gameType.replace(/_/g, " ").replace(/\\b\\w/g, c => c.toUpperCase()) : "Game");
    const action = tx.type === "game_loss" ? "Loss" : tx.type === "game_win" ? "Win" : tx.type === "game_bet" ? "Bet" : "Void";
    const lobby = meta.lobby ? `Lobby ${String(meta.lobby).replace(/^Lobby\\s*/i, "")}` : null;
    const stake = meta.stake ?? meta.stakeAmount ?? meta.roomStake ?? meta.stakeRoom;
    const stakeRoom = stake != null ? `Stake Room ${formatCurrency(Number(stake))}` : null;
    const context = lobby || stakeRoom;
    return {
      game, action, context,
      title: `${game} ${action}${context ? ` - ${context}` : ""}`,
      contextLabel: lobby ? "Lobby" : stakeRoom ? "Stake Room" : null,
      contextValue: lobby || (stakeRoom ? formatCurrency(Number(stake)) : null),
    };
  };'''
          new = '''  const getGameTransactionView = (tx: any) => {
    if (!tx?.type || !["game_win", "game_loss", "game_bet", "game_void"].includes(tx.type)) return null;
    const meta = tx.metadata || {};
    const gameType = String(meta.gameType || meta.game || meta.game_type || "").toLowerCase().replace(/[-\\s]/g, "_");
    const gameNames: Record<string, string> = {
      color_game: "Colour Prediction", color_prediction: "Colour Prediction", colour_prediction: "Colour Prediction",
      spin_battle: "Spin Battle", dice_clash: "Dice Clash", dice_royale: "Dice Royale",
      dice_arena: "Dice Arena", coin_flip: "Coin Flip", pvp_coinflip: "Coin Flip", pvp_coin_flip: "Coin Flip",
      reaction_tap: "Reaction Tap",
    };
    const game = gameNames[gameType] || (gameType ? gameType.replace(/_/g, " ").replace(/\\b\\w/g, c => c.toUpperCase()) : "Game");
    const action = tx.type === "game_loss" ? "Loss" : tx.type === "game_win" ? "Win" : tx.type === "game_bet" ? "Bet" : "Void";
    const rawLobby = meta.lobby ?? meta.lobbyName ?? meta.lobby_name;
    const lobby = rawLobby != null && String(rawLobby).trim() !== "" ? `Lobby ${String(rawLobby).replace(/^Lobby\\s*/i, "")}` : null;
    const rawStake = meta.stake ?? meta.stakeAmount ?? meta.roomStake ?? meta.stakeRoom ?? meta.stake_room;
    const stake = rawStake != null && rawStake !== "" && Number.isFinite(Number(rawStake)) ? Number(rawStake) : null;
    const stakeRoom = !lobby && stake != null ? `Stake Room ${formatCurrency(stake)}` : null;
    const context = lobby || stakeRoom;
    return { game, action, context, title: `${game} ${action}${context ? ` - ${context}` : ""}`, contextLabel: lobby ? "Lobby" : stakeRoom ? "Stake Room" : null, contextValue: lobby || (stakeRoom ? formatCurrency(stake!) : null) };
  };
  const getDisplayTransactionId = (tx: any) => {
    const explicit = tx?.metadata?.transactionId || tx?.metadata?.transaction_id;
    if (explicit) return String(explicit);
    const timestamp = new Date(tx.createdAt).getTime();
    const safeTimestamp = Number.isFinite(timestamp) ? timestamp : Date.now();
    const suffix = String(tx.id || "").replace(/-/g, "").slice(0, 9).toLowerCase() || "000000000";
    return `tx_${safeTimestamp}_${suffix}`;
  };'''
          if old not in s: raise SystemExit('formatter block not found')
          s = s.replace(old, new, 1)
          s = s.replace('{tx.description}', '{gameView?.title || tx.description}', 1)
          s = s.replace('{ label: "Transaction ID", value: <span className="font-mono text-xs">{typeof tx.id === "string" ? tx.id.slice(0, 23) : tx.id}</span> },', '{ label: "Transaction ID", value: <span className="font-mono text-xs break-all">{getDisplayTransactionId(tx)}</span> },', 1)
          p.write_text(s)
      - name: Verify frontend build
        run: npm ci && npm run build
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/pages/Wallet.tsx
          git commit -m 'Apply wallet game transaction format' || exit 0
          git push

# retrigger
