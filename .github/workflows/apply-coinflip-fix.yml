name: Apply Coin Flip Fix

on:
  push:
    branches: [main]

jobs:
  apply:
    if: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted Coin Flip fixes
        shell: python
        run: |
          from pathlib import Path
          import re
          
          frontend = Path('src/app/pages/PvPCoinFlipGame.tsx')
          text = frontend.read_text()
          original = text
          
          marker = 'const PLATFORM_FEE_PERCENT = 10;'
          constants = '''const PLATFORM_FEE_PERCENT = 10;\n\nconst COIN_FLIP_PHASE_MS = {\n  sideAssignment: 3000,\n  flipping: 6000,\n  reveal: 8500,\n  winner: 10500,\n  popup: 12500,\n};'''
          assert marker in text
          text = text.replace(marker, constants, 1)
          
          marker = '  const hasStarted = useRef(false);\n  const transactionRecorded = useRef(false);'
          replacement = '''  const hasStarted = useRef(false);\n  const transactionRecorded = useRef(false);\n  const syncTimersRef = useRef<ReturnType<typeof setTimeout>[]>([]);\n\n  const clearSyncTimers = () => {\n    syncTimersRef.current.forEach(clearTimeout);\n    syncTimersRef.current = [];\n  };\n\n  const scheduleMatchPhase = (md: CoinFlipMatchData, phaseOffsetMs: number, callback: () => void) => {\n    const serverClockOffset = md.serverNow - Date.now();\n    const targetServerTime = md.lifecycleStartedAt + phaseOffsetMs;\n    const delay = Math.max(0, targetServerTime - (Date.now() + serverClockOffset));\n    const timer = setTimeout(callback, delay);\n    syncTimersRef.current.push(timer);\n    return timer;\n  };'''
          assert marker in text
          text = text.replace(marker, replacement, 1)
          
          text = text.replace('setTimeout(() => { if (!cancelled) assignSides(match); }, 3000);', 'scheduleMatchPhase(match, COIN_FLIP_PHASE_MS.sideAssignment, () => { if (!cancelled) assignSides(match); });', 1)
          text = text.replace('setTimeout(() => assignSides(match), 3000);', 'scheduleMatchPhase(match, COIN_FLIP_PHASE_MS.sideAssignment, () => assignSides(match));', 2)
          text = text.replace('        }, 2000);', '        }, 250);', 1)
          
          marker = '''    setGameState("side_assignment");\n    setTimeout(() => { startGame(data, assignedPlayerSide, data.matchId); }, 3000);'''
          replacement = '''    setGameState("side_assignment");\n    scheduleMatchPhase(data, COIN_FLIP_PHASE_MS.flipping, () => { startGame(data, assignedPlayerSide, data.matchId); });'''
          assert marker in text
          text = text.replace(marker, replacement, 1)
          
          text = text.replace('    setGameState("flipping");\n\n    setTimeout(() => {', '    setGameState("flipping");\n\n    scheduleMatchPhase(md, COIN_FLIP_PHASE_MS.reveal, () => {', 1)
          text = text.replace('      setGameState("showing_result");\n      setTimeout(async () => {', '      setGameState("showing_result");\n      scheduleMatchPhase(md, COIN_FLIP_PHASE_MS.winner, async () => {', 1)
          text = text.replace('        setTimeout(() => { setShowResultPopup(true); }, 2000);', '        scheduleMatchPhase(md, COIN_FLIP_PHASE_MS.popup, () => { setShowResultPopup(true); });', 1)
          
          text = text.replace('    if (pollRef.current) {\n      clearInterval(pollRef.current);\n      pollRef.current = null;\n    }\n    setShowResultPopup(false);', '    if (pollRef.current) {\n      clearInterval(pollRef.current);\n      pollRef.current = null;\n    }\n    clearSyncTimers();\n    setShowResultPopup(false);', 1)
          
          history_marker = '{sessionHistory.length > 0 && (<Card className="mt-4 bg-white dark:bg-gray-900/50 border border-gray-200 dark:border-gray-800 shadow-sm"><div className="p-4"><h3'
          fee_re = re.compile(r'\n      <Card className="mt-4 bg-white dark:bg-gray-900/50 border border-gray-200 dark:border-gray-800 shadow-sm"><div className="p-3"><div className="text-xs text-gray-600 dark:text-gray-400 text-center">Platform fee: \{PLATFORM_FEE_PERCENT\}% • Winner receives: \{formatCurrencyNoDecimals\(totalPot - Math.floor\(totalPot \* \(PLATFORM_FEE_PERCENT / 100\)\)\)\}</div></div></Card>')
          fee_match = fee_re.search(text)
          assert fee_match, 'Platform fee card not found'
          fee_block = fee_match.group(0).strip('\n')
          text = text[:fee_match.start()] + '\n' + text[fee_match.end():]
          assert history_marker in text, 'History card marker not found after fee removal'
          text = text.replace(history_marker, fee_block + '\n\n      ' + history_marker, 1)
          
          assert text != original
          frontend.write_text(text)
          
          service = Path('src/app/services/gameMatchmakingService.ts')
          s = service.read_text()
          marker = '  signalSentAt:string | null;\n  yourReady:   boolean;'
          replacement = '  signalSentAt:string | null;\n  serverNow: number;\n  lifecycleStartedAt: number;\n  yourReady:   boolean;'
          assert marker in s
          s = s.replace(marker, replacement, 1)
          service.write_text(s)
          
      - name: Commit targeted changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/PvPCoinFlipGame.tsx src/app/services/gameMatchmakingService.ts
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "Fix Coin Flip platform card and synchronized lifecycle" || exit 0
          git push
