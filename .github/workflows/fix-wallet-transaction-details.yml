name: Fix Wallet Transaction Details

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-wallet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch active Wallet transaction details
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/pages/Wallet.tsx')
          s = p.read_text()

          old_id = '{ label: "Transaction ID", value: <span className="font-mono text-xs break-all">{tx.id}</span> },'
          new_id = '{ label: "Transaction ID", value: <span className="font-mono text-xs">{typeof tx.id === "string" ? tx.id.slice(0, 23) : tx.id}</span> },'
          if old_id in s:
              s = s.replace(old_id, new_id, 1)

          old_details = '''                      <div className="px-4 pb-4 pt-3 bg-muted/30 dark:bg-white/[0.02] border-t border-border">\n                        <div className="space-y-2">'''
          new_details = '''                      <div className="px-4 pb-4 pt-3 bg-muted/30 dark:bg-white/[0.02] border-t border-border">\n                        <p className="text-xs font-semibold uppercase tracking-widest text-muted-foreground mb-3">More Details</p>\n                        <div className="space-y-2">'''
          if old_details in s and 'tracking-widest text-muted-foreground mb-3">More Details' not in s:
              s = s.replace(old_details, new_details, 1)

          p.write_text(s)
          PY

          git diff --check
          git diff -- src/app/pages/Wallet.tsx

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/Wallet.tsx
          if git diff --cached --quiet; then
            echo "No Wallet patch needed."
          else
            git commit -m "Fix Wallet transaction detail display"
            git push
          fi
