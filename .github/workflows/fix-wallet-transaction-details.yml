name: Fix Wallet Transaction Details
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply transaction history patch
        run: python3 scripts/patch-transaction-history.py
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/contexts/TransactionContext.tsx src/app/pages/Wallet.tsx
          git rm scripts/patch-transaction-history.py .github/workflows/fix-wallet-transaction-details.yml .github/workflows/apply-transaction-history-frontend.yml src/app/.transaction-history-trigger || true
          git commit -m "Upgrade transaction history details"
          git push
