name: Fix Wallet Transaction Details
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply transaction history patch
        run: |
          sed -i 's/s,n=re.subn(pattern,label,s,count=1,flags=re.S)/s,n=re.subn(pattern,lambda _m: label,s,count=1,flags=re.S)/' scripts/patch-transaction-history.py
          sed -i 's#end=s.index.*#m=re.search(r"\\n\\s*\\n\\s*\\)}", s[start:]); end=start + m.start() + m.group().rfind("\\)}") + 2#' scripts/patch-transaction-history.py
          python3 scripts/patch-transaction-history.py
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/contexts/TransactionContext.tsx src/app/pages/Wallet.tsx
          git rm scripts/patch-transaction-history.py .github/workflows/fix-wallet-transaction-details.yml .github/workflows/apply-transaction-history-frontend.yml src/app/.transaction-history-trigger src/app/.transaction-history-trigger-2 src/app/.transaction-history-trigger-3 src/app/.transaction-history-trigger-4 || true
          git commit -m "Upgrade transaction history details"
          git push
