name: Apply Color Prediction fixes

on:
  push:
    branches:
      - fix/color-prediction-presence-wallet-stats

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch frontend authority and presence
        run: |
          python3 <<'PY'
          from pathlib import Path

          # ColorGame: server lobby presence + global history/round display.
          p = Path('src/app/pages/ColorGame.tsx')
          s = p.read_text()
          if 'const lobbyPresenceRef' not in s:
              s = s.replace(
                  '  const resultModalTimerRef = useRef<ReturnType<typeof setTimeout> | null>(null);',
                  '  const resultModalTimerRef = useRef<ReturnType<typeof setTimeout> | null>(null);\n  const lobbyPresenceRef = useRef<ReturnType<typeof setInterval> | null>(null);'
              )
          s = s.replace(
              '    voided: data.voided ?? false,\n  };',
              '    voided: data.voided ?? false,\n    lobbyPlayers: data.lobbyPlayers ?? 0,\n  };'
          )
          presence_effect = '''\n  // Server-authoritative lobby presence. The backend TTL determines who is currently inside this lobby.\n  useEffect(() => {\n    if (!useBackend()) return;\n    const token = getToken();\n    if (!token) return;\n    let active = true;\n    const heartbeat = async () => {\n      try {\n        await fetch(`${API_BASE}/api/v1/games/color/lobbies/${lid}/presence`, {\n          method: "POST",\n          headers: { Authorization: `Bearer ${token}` },\n        });\n      } catch {}\n    };\n    heartbeat();\n    lobbyPresenceRef.current = setInterval(heartbeat, 5000);\n    return () => {\n      active = false;\n      if (lobbyPresenceRef.current) clearInterval(lobbyPresenceRef.current);\n      if (active) return;\n      try {\n        fetch(`${API_BASE}/api/v1/games/color/lobbies/${lid}/presence`, {\n          method: "DELETE",\n          headers: { Authorization: `Bearer ${token}` },\n          keepalive: true,\n        }).catch(() => {});\n      } catch {}\n    };\n  }, [lid]);\n'''
          if 'Server-authoritative lobby presence.' not in s:
              marker = '  useEffect(() => () => {\n    if (resultModalTimerRef.current) clearTimeout(resultModalTimerRef.current);\n  }, []);\n'
              s = s.replace(marker, marker + presence_effect)
          # Show lobby-wide presence without changing the existing RED/BLUE bettor counts.
          s = s.replace(
              '<Badge variant={gameState.state === "WAITING" ? "default" : "secondary"} className="uppercase">{gameState.state}</Badge>',
              '<Badge variant={gameState.state === "WAITING" ? "default" : "secondary"} className="uppercase">{gameState.state}</Badge>\n              <Badge variant="outline" className="gap-1"><Users className="h-3 w-3" />{gameState.lobbyPlayers} in lobby</Badge>'
          )
          p.write_text(s)

          # Wallet: a settled loss is a debit. A color bet itself no longer creates a transaction row.
          p = Path('src/app/pages/Wallet.tsx')
          s = p.read_text()
          s = s.replace(
              'const isDebit = tx.type === "withdrawal" || tx.type === "game_bet" || tx.type === "vip_purchase";',
              'const isDebit = tx.type === "withdrawal" || tx.type === "game_bet" || tx.type === "game_loss" || tx.type === "vip_purchase";'
          )
          p.write_text(s)

          # Game stats: backend is the only authority. Local storage is removed as a source of truth.
          p = Path('src/app/contexts/GameStatsContext.tsx')
          s = p.read_text()
          start = s.index('type GameResult =')
          # Replace the entire context implementation with a backend-authoritative implementation.
          s = '''import { createContext, useContext, useState, useEffect, useCallback, ReactNode } from "react";\n\ntype GameResult = {\n  id: string;\n  gameType: string;\n  lobby?: string;\n  betAmount: number;\n  winAmount: number;\n  profit: number;\n  timestamp: string;\n  won: boolean;\n  opponent?: string;\n  outcome?: string;\n};\n\ntype GameStats = {\n  totalGames: number;\n  totalWins: number;\n  totalLosses: number;\n  totalProfit: number;\n  winRate: number;\n  gameHistory: GameResult[];\n};\n\ntype GameStatsContextType = {\n  stats: GameStats;\n  addGameResult: (result: Omit<GameResult, "id" | "timestamp">) => void;\n  resetStats: () => void;\n  refreshStatsFromBackend: () => Promise<void>;\n};\n\nconst GameStatsContext = createContext<GameStatsContextType | undefined>(undefined);\nconst INITIAL_STATS: GameStats = { totalGames: 0, totalWins: 0, totalLosses: 0, totalProfit: 0, winRate: 0, gameHistory: [] };\nconst API_BASE = (import.meta as any).env?.VITE_API_URL as string | undefined;\nfunction token() { return localStorage.getItem("bitzimi_access_token"); }\n\nexport function GameStatsProvider({ children }: { children: ReactNode }) {\n  const [stats, setStats] = useState<GameStats>(INITIAL_STATS);\n\n  const refreshStatsFromBackend = useCallback(async () => {\n    if (!API_BASE || !token()) return;\n    try {\n      const res = await fetch(`${API_BASE}/api/v1/games/stats`, { headers: { Authorization: `Bearer ${token()}` } });\n      if (!res.ok) return;\n      const json = await res.json();\n      const o = json?.data?.overall;\n      if (!o) return;\n      setStats({\n        totalGames: Number(o.totalGames ?? 0),\n        totalWins: Number(o.wins ?? 0),\n        totalLosses: Number(o.losses ?? 0),\n        totalProfit: Number(o.profit ?? 0),\n        winRate: Number(o.winRate ?? 0),\n        gameHistory: [],\n      });\n    } catch {}\n  }, []);\n\n  useEffect(() => { refreshStatsFromBackend(); }, [refreshStatsFromBackend]);\n\n  // Existing game screens may call this after a result. Do not mutate local totals;\n  // the backend settlement/stat row is authoritative and is re-read instead.\n  const addGameResult = (_result: Omit<GameResult, "id" | "timestamp">) => {\n    refreshStatsFromBackend();\n  };\n\n  const resetStats = () => {\n    // Stats are backend-owned and cannot be reset from the client.\n    refreshStatsFromBackend();\n  };\n\n  return <GameStatsContext.Provider value={{ stats, addGameResult, resetStats, refreshStatsFromBackend }}>{children}</GameStatsContext.Provider>;\n}\n\nexport function useGameStats() {\n  const context = useContext(GameStatsContext);\n  if (!context) throw new Error("useGameStats must be used within GameStatsProvider");\n  return context;\n}\n'''
          p.write_text(s)

          # Profile: read game activity from the backend stats response rather than local GameStatsContext.
          p = Path('src/app/pages/Profile.tsx')
          s = p.read_text()
          s = s.replace(
              '  const { stats } = useGameStats();',
              '  const { stats } = useGameStats();\n  const [backendGameActivity, setBackendGameActivity] = useState({ totalGames: 0, wins: 0, winRate: 0, totalEarned: 0 });'
          )
          s = s.replace(
              '  const gameActivity = {\n    totalGames: stats.totalGames,\n    wins: stats.totalWins,\n    winRate: stats.winRate,\n    totalEarned: stats.totalProfit,\n  };',
              '  const gameActivity = backendGameActivity.totalGames || backendGameActivity.wins || backendGameActivity.totalEarned\n    ? backendGameActivity\n    : { totalGames: stats.totalGames, wins: stats.totalWins, winRate: stats.winRate, totalEarned: stats.totalProfit };'
          )
          s = s.replace(
              '      // Backend stats are the source of truth; they are also available via GameStatsContext\n',
              '      const o = statsJson.data.overall;\n      setBackendGameActivity({ totalGames: Number(o.totalGames ?? 0), wins: Number(o.wins ?? 0), winRate: Number(o.winRate ?? 0), totalEarned: Number(o.profit ?? 0) });\n'
          )
          p.write_text(s)
          PY

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/ColorGame.tsx src/app/pages/Wallet.tsx src/app/contexts/GameStatsContext.tsx src/app/pages/Profile.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Color lobby presence wallet history and game activity"
            git push
          fi
