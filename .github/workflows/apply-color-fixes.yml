name: Apply final Color Prediction frontend fixes
on:
  push:
    branches: [fix/color-prediction-presence-wallet-stats]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('src/app/pages/ColorGame.tsx'); s=p.read_text()
          if 'lobbyPresenceRef' not in s:
            s=s.replace('  const resultModalTimerRef = useRef<ReturnType<typeof setTimeout> | null>(null);','  const resultModalTimerRef = useRef<ReturnType<typeof setTimeout> | null>(null);\n  const lobbyPresenceRef = useRef<ReturnType<typeof setInterval> | null>(null);')
          s=s.replace('    voided: data.voided ?? false,\n  };','    voided: data.voided ?? false,\n    lobbyPlayers: data.lobbyPlayers ?? 0,\n  };')
          if 'Server-authoritative lobby presence.' not in s:
            marker='  useEffect(() => () => {\n    if (resultModalTimerRef.current) clearTimeout(resultModalTimerRef.current);\n  }, []);\n'
            effect='''\n  // Server-authoritative lobby presence.\n  useEffect(() => {\n    if (!useBackend()) return;\n    const token = getToken(); if (!token) return;\n    const heartbeat = async () => { try { await fetch(`${API_BASE}/api/v1/games/color/lobbies/${lid}/presence`, { method: "POST", headers: { Authorization: `Bearer ${token}` } }); } catch {} };\n    heartbeat();\n    lobbyPresenceRef.current = setInterval(heartbeat, 5000);\n    return () => { if (lobbyPresenceRef.current) clearInterval(lobbyPresenceRef.current); try { fetch(`${API_BASE}/api/v1/games/color/lobbies/${lid}/presence`, { method: "DELETE", headers: { Authorization: `Bearer ${token}` }, keepalive: true }).catch(() => {}); } catch {} };\n  }, [lid]);\n'''
            s=s.replace(marker,marker+effect)
          badge='<Badge variant="outline" className="gap-1"><Users className="h-3 w-3" />{gameState.lobbyPlayers} in lobby</Badge>'
          status='<Badge variant={gameState.state === "WAITING" ? "default" : "secondary"} className="uppercase">{gameState.state}</Badge>'
          s=s.replace(badge,'')
          s=s.replace(status,status+'\n              '+badge)
          p.write_text(s)

          p=Path('src/app/pages/Wallet.tsx'); s=p.read_text(); s=s.replace('const isDebit = tx.type === "withdrawal" || tx.type === "game_bet" || tx.type === "vip_purchase";','const isDebit = tx.type === "withdrawal" || tx.type === "game_bet" || tx.type === "game_loss" || tx.type === "vip_purchase";'); p.write_text(s)

          p=Path('src/app/contexts/GameStatsContext.tsx')
          p.write_text('''import { createContext, useContext, useState, useEffect, useCallback, type ReactNode } from "react";\ntype GameResult={id:string;gameType:string;lobby?:string;betAmount:number;winAmount:number;profit:number;timestamp:string;won:boolean;opponent?:string;outcome?:string};\ntype GameStats={totalGames:number;totalWins:number;totalLosses:number;totalProfit:number;winRate:number;gameHistory:GameResult[]};\ntype GameStatsContextType={stats:GameStats;addGameResult:(result:Omit<GameResult,"id"|"timestamp">)=>void;resetStats:()=>void;refreshStatsFromBackend:()=>Promise<void>};\nconst GameStatsContext=createContext<GameStatsContextType|undefined>(undefined); const INITIAL_STATS:GameStats={totalGames:0,totalWins:0,totalLosses:0,totalProfit:0,winRate:0,gameHistory:[]}; const API_BASE=(import.meta as any).env?.VITE_API_URL as string|undefined; const token=()=>localStorage.getItem("bitzimi_access_token");\nexport function GameStatsProvider({children}:{children:ReactNode}){ const [stats,setStats]=useState<GameStats>(INITIAL_STATS); const refreshStatsFromBackend=useCallback(async()=>{if(!API_BASE||!token())return;try{const r=await fetch(`${API_BASE}/api/v1/games/stats`,{headers:{Authorization:`Bearer ${token()}`}});if(!r.ok)return;const j=await r.json();const o=j?.data?.overall;if(!o)return;setStats({totalGames:Number(o.totalGames??0),totalWins:Number(o.wins??0),totalLosses:Number(o.losses??0),totalProfit:Number(o.profit??0),winRate:Number(o.winRate??0),gameHistory:[]});}catch{}},[]); useEffect(()=>{refreshStatsFromBackend()},[refreshStatsFromBackend]); const addGameResult=(_r:Omit<GameResult,"id"|"timestamp">)=>{refreshStatsFromBackend()}; const resetStats=()=>{refreshStatsFromBackend()}; return <GameStatsContext.Provider value={{stats,addGameResult,resetStats,refreshStatsFromBackend}}>{children}</GameStatsContext.Provider> }\nexport function useGameStats(){const c=useContext(GameStatsContext);if(!c)throw new Error("useGameStats must be used within GameStatsProvider");return c}\n''')

          p=Path('src/app/pages/Profile.tsx'); s=p.read_text()
          if 'backendGameActivity' not in s:
            s=s.replace('  const { stats } = useGameStats();','  const { stats } = useGameStats();\n  const [backendGameActivity, setBackendGameActivity] = useState({ totalGames: 0, wins: 0, winRate: 0, totalEarned: 0 });')
            s=s.replace('  const gameActivity = {\n    totalGames: stats.totalGames,\n    wins: stats.totalWins,\n    winRate: stats.winRate,\n    totalEarned: stats.totalProfit,\n  };','  const gameActivity = backendGameActivity;')
            s=s.replace('      // Backend stats are the source of truth; they are also available via GameStatsContext','      setBackendGameActivity({ totalGames: Number(o.totalGames ?? 0), wins: Number(o.wins ?? 0), winRate: Number(o.winRate ?? 0), totalEarned: Number(o.profit ?? 0) });')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/ColorGame.tsx src/app/pages/Wallet.tsx src/app/contexts/GameStatsContext.tsx src/app/pages/Profile.tsx
          git commit -m "Normalize Color lobby presence badge" || true
          git push
