name: One-off game header layout fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply header layout
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_section(path, marker, end_marker, replacement):
              p = Path(path)
              s = p.read_text()
              start = s.find(marker)
              if start < 0:
                  raise SystemExit(f'{path}: marker not found: {marker}')
              end = s.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{path}: end marker not found: {end_marker}')
              p.write_text(s[:start] + replacement + s[end:])

          rules = '''<Button
          variant="outline"
          size="sm"
          onClick={() => setShowRules(!showRules)}
          className="border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white px-4 rounded-lg transition-all shrink-0"
          >
            <Info className="h-4 w-4 mr-2" />
            Rules
          </Button>'''
          fairness = '''<Button variant="outline" size="sm" onClick={() => setShowFairness(true)} className="flex items-center gap-1.5"><Shield className="h-3.5 w-3.5" />Verify Fairness</Button>'''

          no_round = {
              'src/app/pages/PvPCoinFlipGame.tsx': ('Coin Flip', 'stakeAmount', '        '),
              'src/app/pages/DiceDuelGame.tsx': ('Dice Clash', 'stake', '          '),
          }
          for path, (title, stake, ind) in no_round.items():
              replacement = f'''/* [Title Row] - Spin Battle-style two-row header */
{ind}<div className="grid grid-cols-[minmax(0,1fr)_auto] gap-x-3 gap-y-1 items-center">
{ind}  <div className="min-w-0 flex items-center gap-[6px]">
{ind}    <h1 className="text-xl font-bold text-gray-900 dark:text-white whitespace-nowrap">{title}</h1>
{ind}    <span className="text-sm text-gray-500 whitespace-nowrap">- Stake Room {{formatCurrencyNoDecimals({stake})}}</span>
{ind}  </div>
{ind}  <div className="flex items-center justify-end">{rules}</div>
{ind}  <div className="min-w-0 flex items-center gap-[6px]">
{ind}    <span className="text-sm text-gray-500 whitespace-nowrap">{title} - Stake Room {{formatCurrencyNoDecimals({stake})}}</span>
{ind}  </div>
{ind}  <div className="flex items-center justify-end">{fairness}</div>
{ind}</div>

'''
              replace_section(path, '/* [Title Row]', '/* Game Rules Panel */', replacement)

          for path, title, stake in [
              ('src/app/pages/DiceRoyaleGame.tsx', 'Dice Royale', 'initialStake'),
              ('src/app/pages/DiceArenaGame.tsx', 'Dice Arena', 'initialStake'),
          ]:
              ind = '          '
              replacement = f'''/* [Title Row] - Spin Battle-style two-row header */
{ind}<div className="grid grid-cols-[minmax(0,1fr)_auto] gap-x-3 gap-y-1 items-center">
{ind}  <div className="min-w-0 flex items-center gap-[6px]">
{ind}    <h1 className="text-xl font-bold text-gray-900 dark:text-white whitespace-nowrap">{title}</h1>
{ind}    <span className="text-sm text-gray-500 whitespace-nowrap">- Stake Room {{formatCurrencyNoDecimals({stake})}}</span>
{ind}  </div>
{ind}  <div className="flex items-center justify-end">{rules}</div>
{ind}  <div className="min-w-0 flex items-center gap-2">
{ind}    <span className="text-sm text-gray-500 whitespace-nowrap">Round #{{roundNumber}}</span>
{ind}    <span className="inline-flex items-center gap-1 text-xs text-green-500 font-semibold"><span className="w-1.5 h-1.5 rounded-full bg-green-500" />LIVE</span>
{ind}  </div>
{ind}  <div className="flex items-center justify-end">{fairness}</div>
{ind}</div>

'''
              replace_section(path, '/* [Title Row]', '/* Game Rules Panel */', replacement)

          # Reaction Tap: preserve its existing gameplay; only normalize the top header.
          p = Path('src/app/pages/ReactionTapGameRoom.tsx')
          s = p.read_text()
          h = s.find('<h1 className="text-xl font-bold')
          if h < 0:
              raise SystemExit('ReactionTapGameRoom.tsx: heading not found')
          # The existing top header begins at the nearest div before the heading and ends at the matching outer div.
          start = s.rfind('<div', 0, h)
          depth = 0
          i = start
          while i < len(s):
              if s.startswith('<div', i):
                  depth += 1
                  i += 4
                  continue
              if s.startswith('</div>', i):
                  depth -= 1
                  i += 6
                  if depth == 0:
                      break
                  continue
              i += 1
          if depth != 0:
              raise SystemExit('ReactionTapGameRoom.tsx: header boundary not found')
          replacement = '''<div className="grid grid-cols-[minmax(0,1fr)_auto] gap-x-3 gap-y-1 items-center mb-6">
  <div className="min-w-0 flex items-center gap-[6px]">
    <h1 className="text-xl font-bold text-gray-900 dark:text-white whitespace-nowrap">Reaction Tap</h1>
    <span className="text-sm text-gray-500 whitespace-nowrap">- Stake Room {formatCurrencyNoDecimals(stakeAmount)}</span>
  </div>
  <div className="flex items-center justify-end">
    <Button variant="outline" size="sm" onClick={() => setShowRules(!showRules)} className="border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300 px-4 rounded-lg transition-all shrink-0">
      <Info className="h-4 w-4 mr-2" />
      Rules
    </Button>
  </div>
  <div className="min-w-0 flex items-center gap-[6px]">
    <span className="text-sm text-gray-500 whitespace-nowrap">Reaction Tap - Stake Room {formatCurrencyNoDecimals(stakeAmount)}</span>
  </div>
</div>'''
          p.write_text(s[:start] + replacement + s[i:])
          PY

      - name: Validate
        run: |
          git diff --check
          npm ci
          npm run build

      - name: Commit source changes and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/PvPCoinFlipGame.tsx src/app/pages/DiceDuelGame.tsx src/app/pages/DiceRoyaleGame.tsx src/app/pages/DiceArenaGame.tsx src/app/pages/ReactionTapGameRoom.tsx
          git rm .github/workflows/one-off-game-header-layout.yml
          git commit -m "fix: align game play headers with Spin Battle"
          git push