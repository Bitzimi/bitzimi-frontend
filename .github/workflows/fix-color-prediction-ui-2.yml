name: Fix Color Prediction UI 2
on:
  push:
    branches: [fix/color-prediction-round-wheel-wallet-ui]
    paths:
      - '.github/workflows/fix-color-prediction-ui-2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine layout
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('src/app/pages/ColorGame.tsx'); s=p.read_text()
          # Exact two-row header requested by the user.
          pattern=r'<div className="mb-6">\s*<div className="flex items-center justify-between">.*?<Button variant=\\"outline\\" size=\\"sm\\" onClick=\{\(\) => setShowRules\(true\)\}><Info className=\\"mr-2 h-4 w-4\\" />Rules</Button>\s*</div>\s*</div>'
          replacement='''<div className="mb-6">\n        <div className="grid grid-cols-[minmax(0,1fr)_auto] gap-x-3 gap-y-1 items-center">\n          <div className="flex items-center gap-2 min-w-0">\n            <h2 className="text-base sm:text-lg md:text-2xl font-semibold truncate">Red vs Blue Game</h2>\n            <div className="flex items-center gap-1 px-2 py-0.5 bg-red-600 rounded-full animate-pulse shrink-0">\n              <div className="w-2 h-2 bg-white rounded-full" />\n              <span className="text-xs font-bold text-white uppercase tracking-wide">LIVE</span>\n            </div>\n          </div>\n          <Button variant="outline" size="sm" onClick={() => setShowRules(true)} className="h-8 px-3 shrink-0"><Info className="mr-1.5 h-4 w-4" />Rules</Button>\n          <p className="text-sm md:text-base text-gray-600 whitespace-nowrap">Round #{gameState.dailyRoundNumber ?? gameState.roundNumber} <span className="text-xs text-gray-400">today</span></p>\n          <Badge variant={gameState.state === "WAITING" ? "default" : "secondary"} className="uppercase h-7 px-2.5 text-xs justify-self-end shrink-0">{gameState.state}</Badge>\n        </div>\n      </div>'''
          s2=re.sub(pattern,replacement,s,count=1,flags=re.S)
          if s2==s:
            # fallback: use the known title-to-rules region without relying on whitespace.
            start=s.find('<div className="mb-6">', s.find('Red vs Blue Game')-100)
            end=s.find('</div>\n      </div>', s.find('Rules</Button>', start))
            if start>=0 and end>=0:
              end += len('</div>\n      </div>')
              s=s[:start]+replacement+s[end:]
          else: s=s2
          # Keep bet confirmation to one visual line.
          s=s.replace('<Alert className="border-blue-200 bg-blue-50"><AlertCircle className="h-4 w-4 text-blue-600" /><AlertDescription className="text-blue-800">Bet locked for this round. Wait for results!</AlertDescription></Alert>', '<Alert className="border-blue-200 bg-blue-50 py-2"><AlertCircle className="h-4 w-4 text-blue-600 shrink-0" /><AlertDescription className="text-blue-800 text-xs sm:text-sm whitespace-nowrap overflow-hidden text-ellipsis">Bet locked for this round. Wait for results!</AlertDescription></Alert>')
          p.write_text(s)

          p=Path('src/app/pages/Wallet.tsx'); s=p.read_text()
          s=s.replace('tx.metadata?.gameType ? { label: "Game", value: tx.metadata.gameType.replace(/_/g, " ") } : null,', 'tx.metadata?.gameType ? { label: "Game", value: ({ color_game: "Colour Prediction", color_prediction: "Colour Prediction", spin_battle: "Spin Battle", dice_clash: "Dice Clash", dice_royale: "Dice Royale", dice_arena: "Dice Arena", reaction_tap: "Reaction Tap", coin_flip: "Coin Flip" } as Record<string,string>)[tx.metadata.gameType] ?? tx.metadata.gameType.replace(/_/g, " ") } : null,')
          p.write_text(s)
      - name: Build
        run: npm install && npm run build
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-color-prediction-ui-2.yml
          git add src/app/pages/ColorGame.tsx src/app/pages/Wallet.tsx
          git commit -m 'Refine Color Prediction mobile layout and wallet game labels'
          git push
