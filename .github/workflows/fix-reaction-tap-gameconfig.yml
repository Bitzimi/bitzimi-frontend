name: Fix Reaction Tap stale game config call

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Remove temporary Reaction Tap game config workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove invalid getGameConfig call
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/pages/ReactionTapGameRoom.tsx')
          s = p.read_text()
          old = '  useEffect(() => { gameMatchmakingService.getGameConfig("reaction_tap").catch(() => {}); }, []);\n'
          if old not in s:
              raise SystemExit('Expected stale getGameConfig call was not found')
          p.write_text(s.replace(old, '', 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/pages/ReactionTapGameRoom.tsx
          git commit -m 'Fix Reaction Tap invalid game config call'
          git push
