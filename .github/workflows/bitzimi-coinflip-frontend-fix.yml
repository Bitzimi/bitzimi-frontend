name: Apply Coin Flip frontend fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Coin Flip frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/services/gameMatchmakingService.ts')
          s=p.read_text()
          s=s.replace('''  payout:      number;\n  createdAt:   string;''','''  payout:      number;\n  playerIsHome?: boolean;\n  createdAt:   string;''')
          marker='''  /** ReactionTap: signal you are ready to see the signal. */\n'''
          method='''  /** Coin Flip: acknowledge the revealed result and settle the backend escrow. */\n  async settleCoinFlip(matchId: string): Promise<{ settled: boolean; winnerId: string; payout: number }> {\n    return apiFetch(`/api/v1/games/matches/${matchId}/settle`, { method: "POST", body: "{}" });\n  },\n\n'''
          if marker not in s: raise SystemExit('service marker not found')
          s=s.replace(marker,method+marker)
          p.write_text(s)

          p=Path('src/app/pages/PvPCoinFlipGame.tsx')
          s=p.read_text()
          s=s.replace('''  const [playerSide, setPlayerSide] = useState<CoinSide | null>(null);\n  const [opponentSide, setOpponentSide] = useState<CoinSide | null>(null);\n''','''  const [playerSide, setPlayerSide] = useState<CoinSide | null>(null);\n  const [opponentSide, setOpponentSide] = useState<CoinSide | null>(null);\n  const [playerIsHome, setPlayerIsHome] = useState(true);\n''')
          old='''  const assignSides = (md?: CoinFlipMatchData) => {\n    const data = md ?? matchData;\n    if (!data?.result) { navigate("/game/pvp-coinflip"); return; }\n    const isP1 = data.isPlayer1;\n    const assignedPlayerSide: CoinSide   = isP1 ? data.result.p1Side : data.result.p2Side;\n    const assignedOpponentSide: CoinSide = isP1 ? data.result.p2Side : data.result.p1Side;\n    setPlayerSide(assignedPlayerSide);\n    setOpponentSide(assignedOpponentSide);\n    setGameState("side_assignment");\n    setTimeout(() => { startGame(data, assignedPlayerSide); }, 3000);\n  };\n'''
          new='''  const assignSides = (md?: CoinFlipMatchData) => {\n    const data = md ?? matchData;\n    if (!data?.result) { navigate("/game/pvp-coinflip"); return; }\n    const isP1 = data.isPlayer1;\n    setPlayerIsHome(Boolean(data.playerIsHome));\n    const assignedPlayerSide: CoinSide   = isP1 ? data.result.p1Side : data.result.p2Side;\n    const assignedOpponentSide: CoinSide = isP1 ? data.result.p2Side : data.result.p1Side;\n    setPlayerSide(assignedPlayerSide);\n    setOpponentSide(assignedOpponentSide);\n    setGameState("side_assignment");\n    setTimeout(() => { startGame(data, assignedPlayerSide); }, 3000);\n  };\n'''
          if old not in s: raise SystemExit('assignSides block not found')
          s=s.replace(old,new)

          old='''          {/* Players */}\n          <div className="flex items-center justify-between mb-6">\n            {/* Player (You) */}\n            <div className="flex flex-col items-center">\n              <div className="w-14 h-14 md:w-16 md:h-16 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-2xl md:text-3xl mb-2 overflow-hidden">\n                <PlayerAvatar avatar={identity.avatar} />\n              </div>\n              <div className="text-xs text-gray-600 dark:text-gray-400 font-medium">{myUsername}</div>\n            </div>\n\n            {/* Center Info */}\n            <div className="flex-1 mx-4 text-center">\n              <div className="text-xs text-gray-700 dark:text-gray-400 bg-gray-200 dark:bg-gray-800/50 rounded px-3 py-1 inline-block">\n                Balance: {formatCurrencyNoDecimals(balances.game)}\n              </div>\n            </div>\n\n            {/* Opponent */}\n            <div className="flex flex-col items-center">\n              <div className="w-14 h-14 md:w-16 md:h-16 rounded-full bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center text-2xl md:text-3xl mb-2 overflow-hidden">\n                <PlayerAvatar avatar={opponentAvatar} />\n              </div>\n              <div className="text-xs text-gray-600 dark:text-gray-400 font-medium">{opponentName}</div>\n            </div>\n          </div>\n'''
          new='''          {/* Players — the backend-authoritative Home/Away assignment determines visual order. */}\n          <div className="flex items-center justify-between mb-6">\n            {playerIsHome ? (\n              <>\n                <div className="flex flex-col items-center"><div className="w-14 h-14 md:w-16 md:h-16 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-2xl md:text-3xl mb-2 overflow-hidden"><PlayerAvatar avatar={identity.avatar} /></div><div className="text-xs text-gray-600 dark:text-gray-400 font-medium">{myUsername}</div></div>\n                <div className="flex-1 mx-4 text-center"><div className="text-xs text-gray-700 dark:text-gray-400 bg-gray-200 dark:bg-gray-800/50 rounded px-3 py-1 inline-block">Balance: {formatCurrencyNoDecimals(balances.game)}</div></div>\n                <div className="flex flex-col items-center"><div className="w-14 h-14 md:w-16 md:h-16 rounded-full bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center text-2xl md:text-3xl mb-2 overflow-hidden"><PlayerAvatar avatar={opponentAvatar} /></div><div className="text-xs text-gray-600 dark:text-gray-400 font-medium">{opponentName}</div></div>\n              </>\n            ) : (\n              <>\n                <div className="flex flex-col items-center"><div className="w-14 h-14 md:w-16 md:h-16 rounded-full bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center text-2xl md:text-3xl mb-2 overflow-hidden"><PlayerAvatar avatar={opponentAvatar} /></div><div className="text-xs text-gray-600 dark:text-gray-400 font-medium">{opponentName}</div></div>\n                <div className="flex-1 mx-4 text-center"><div className="text-xs text-gray-700 dark:text-gray-400 bg-gray-200 dark:bg-gray-800/50 rounded px-3 py-1 inline-block">Balance: {formatCurrencyNoDecimals(balances.game)}</div></div>\n                <div className="flex flex-col items-center"><div className="w-14 h-14 md:w-16 md:h-16 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-2xl md:text-3xl mb-2 overflow-hidden"><PlayerAvatar avatar={identity.avatar} /></div><div className="text-xs text-gray-600 dark:text-gray-400 font-medium">{myUsername}</div></div>\n              </>\n            )}\n          </div>\n'''
          if old not in s: raise SystemExit('top player block not found')
          s=s.replace(old,new)

          old='''                <div className="flex justify-center items-center gap-6 md:gap-10 mb-6">\n                  {/* Your Side */}\n                  <div className="flex flex-col items-center">\n                    <div className="w-20 h-20 md:w-24 md:h-24 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-3xl md:text-4xl mb-3 shadow-xl shadow-blue-500/50 ring-4 ring-blue-400/30 overflow-hidden">\n                      <PlayerAvatar avatar={identity.avatar} />\n                    </div>\n                    <div className="text-sm font-semibold text-blue-400 mb-2">{myUsername}</div>\n                    <div className="text-2xl md:text-3xl font-bold text-white dark:text-white bg-gradient-to-r from-blue-600 to-blue-700 px-5 py-2.5 rounded-xl shadow-lg border-2 border-blue-400">\n                      {playerSide?.toUpperCase()}\n                    </div>\n                  </div>\n\n                  {/* VS Divider */}\n                  <div className="text-3xl md:text-4xl font-bold text-gray-400">VS</div>\n\n                  {/* Opponent Side */}\n                  <div className="flex flex-col items-center">\n                    <div className="w-20 h-20 md:w-24 md:h-24 rounded-full bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center text-3xl md:text-4xl mb-3 shadow-xl shadow-red-500/50 ring-4 ring-red-400/30 overflow-hidden">\n                      <PlayerAvatar avatar={opponentAvatar} />\n                    </div>\n                    <div className="text-sm font-semibold text-red-400 mb-2">{opponentName}</div>\n                    <div className="text-2xl md:text-3xl font-bold text-white dark:text-white bg-gradient-to-r from-red-600 to-red-700 px-5 py-2.5 rounded-xl shadow-lg border-2 border-red-400">\n                      {opponentSide?.toUpperCase()}\n                    </div>\n                  </div>\n                </div>\n'''
          new='''                <div className="flex justify-center items-center gap-6 md:gap-10 mb-6">\n                  {playerIsHome ? (\n                    <>\n                      <div className="flex flex-col items-center"><div className="w-20 h-20 md:w-24 md:h-24 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-3xl md:text-4xl mb-3 shadow-xl shadow-blue-500/50 ring-4 ring-blue-400/30 overflow-hidden"><PlayerAvatar avatar={identity.avatar} /></div><div className="text-sm font-semibold text-blue-400 mb-2">{myUsername}</div><div className="text-2xl md:text-3xl font-bold text-white bg-gradient-to-r from-blue-600 to-blue-700 px-5 py-2.5 rounded-xl shadow-lg border-2 border-blue-400">{playerSide?.toUpperCase()}</div></div>\n                      <div className="text-3xl md:text-4xl font-bold text-gray-400">VS</div>\n                      <div className="flex flex-col items-center"><div className="w-20 h-20 md:w-24 md:h-24 rounded-full bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center text-3xl md:text-4xl mb-3 shadow-xl shadow-red-500/50 ring-4 ring-red-400/30 overflow-hidden"><PlayerAvatar avatar={opponentAvatar} /></div><div className="text-sm font-semibold text-red-400 mb-2">{opponentName}</div><div className="text-2xl md:text-3xl font-bold text-white bg-gradient-to-r from-red-600 to-red-700 px-5 py-2.5 rounded-xl shadow-lg border-2 border-red-400">{opponentSide?.toUpperCase()}</div></div>\n                    </>\n                  ) : (\n                    <>\n                      <div className="flex flex-col items-center"><div className="w-20 h-20 md:w-24 md:h-24 rounded-full bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center text-3xl md:text-4xl mb-3 shadow-xl shadow-red-500/50 ring-4 ring-red-400/30 overflow-hidden"><PlayerAvatar avatar={opponentAvatar} /></div><div className="text-sm font-semibold text-red-400 mb-2">{opponentName}</div><div className="text-2xl md:text-3xl font-bold text-white bg-gradient-to-r from-red-600 to-red-700 px-5 py-2.5 rounded-xl shadow-lg border-2 border-red-400">{opponentSide?.toUpperCase()}</div></div>\n                      <div className="text-3xl md:text-4xl font-bold text-gray-400">VS</div>\n                      <div className="flex flex-col items-center"><div className="w-20 h-20 md:w-24 md:h-24 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-3xl md:text-4xl mb-3 shadow-xl shadow-blue-500/50 ring-4 ring-blue-400/30 overflow-hidden"><PlayerAvatar avatar={identity.avatar} /></div><div className="text-sm font-semibold text-blue-400 mb-2">{myUsername}</div><div className="text-2xl md:text-3xl font-bold text-white bg-gradient-to-r from-blue-600 to-blue-700 px-5 py-2.5 rounded-xl shadow-lg border-2 border-blue-400">{playerSide?.toUpperCase()}</div></div>\n                    </>\n                  )}\n                </div>\n'''
          if old not in s: raise SystemExit('side assignment block not found')
          s=s.replace(old,new)

          old='''      if (!transactionRecorded.current) {\n        transactionRecorded.current = true;\n        refreshWalletsFromBackend().catch(() => {});\n        addToSessionHistory({\n          opponent: gameOpponentName, result: won ? "win" : "loss",\n          outcome: result, amount: won ? payout - stakeAmount : stakeAmount, stake: stakeAmount,\n        });\n        addGameResult({\n          gameType: "pvp_coinflip", betAmount: stakeAmount,\n          winAmount: won ? payout : 0, profit: won ? payout - stakeAmount : -stakeAmount,\n          won, opponent: gameOpponentName, outcome: result,\n        });\n        addNotification(\n          won ? "game_win" : "game_loss",\n          won ? "🎉 Coin Flip Victory!" : "Coin Flip",\n          won\n            ? `Won ${formatCurrencyNoDecimals(payout - stakeAmount)} vs ${gameOpponentAvatar} ${gameOpponentName} (${result.toUpperCase()})`\n            : `Lost ${formatCurrencyNoDecimals(stakeAmount)} vs ${gameOpponentAvatar} ${gameOpponentName} (${result.toUpperCase()})`,\n          { game: "coin_flip", stake: stakeAmount, payout: won ? payout : 0, outcome: result }\n        );\n        if (won) liveActivityService.addActivity("game_win", myUsername, `won in Coin Flip`, payout - stakeAmount);\n      }\n'''
          if old not in s: raise SystemExit('pre-settlement transaction block not found')
          s=s.replace(old,'')

          old='''      setGameState("showing_result");\n      setTimeout(() => {\n        setShowWinner(true);\n        setTimeout(() => { setShowResultPopup(true); }, 2000);\n      }, 2000);\n'''
          new='''      setGameState("showing_result");\n      setTimeout(async () => {\n        setShowWinner(true);\n        try {\n          if (matchId) {\n            await gameMatchmakingService.settleCoinFlip(matchId);\n            await refreshWalletsFromBackend();\n            if (!transactionRecorded.current) {\n              transactionRecorded.current = true;\n              addToSessionHistory({ opponent: gameOpponentName, result: won ? "win" : "loss", outcome: result, amount: won ? payout - stakeAmount : stakeAmount, stake: stakeAmount });\n              addGameResult({ gameType: "pvp_coinflip", betAmount: stakeAmount, winAmount: won ? payout : 0, profit: won ? payout - stakeAmount : -stakeAmount, won, opponent: gameOpponentName, outcome: result });\n              addNotification(won ? "game_win" : "game_loss", won ? "🎉 Coin Flip Victory!" : "Coin Flip", won ? `Won ${formatCurrencyNoDecimals(payout - stakeAmount)} vs ${gameOpponentAvatar} ${gameOpponentName} (${result.toUpperCase()})` : `Lost ${formatCurrencyNoDecimals(stakeAmount)} vs ${gameOpponentAvatar} ${gameOpponentName} (${result.toUpperCase()})`, { game: "coin_flip", stake: stakeAmount, payout: won ? payout : 0, outcome: result });\n              if (won) liveActivityService.addActivity("game_win", myUsername, `won in Coin Flip`, payout - stakeAmount);\n            }\n          }\n        } catch (error) {\n          console.error("Coin Flip settlement acknowledgement failed:", error);\n        }\n        setTimeout(() => { setShowResultPopup(true); }, 2000);\n      }, 2000);\n'''
          if old not in s: raise SystemExit('result timing block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          npm ci
          npm run build
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bitzimi-coinflip-frontend-fix.yml
          git add src/app/services/gameMatchmakingService.ts src/app/pages/PvPCoinFlipGame.tsx
          git commit -m 'Fix Coin Flip player assignment and result settlement UI'
          git push
