name: Run wallet transaction patch v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[transaction-ui-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_wallet_transaction_details_v2.py
      - run: npm install && npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/Wallet.tsx
          git diff --cached --quiet || git commit -m "Fix transaction-specific wallet detail UI [transaction-ui-fixed]"
          git push